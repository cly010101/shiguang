<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="拾光台">
<meta name="application-name" content="拾光台">
<meta name="theme-color" content="#FAFAF7">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="description" content="本地优先的个人生活管理工作台：理财、收藏、物品、打包、旅行、菜单、菜谱、身体、运动、愿望、备忘。数据仅存本机浏览器。">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>拾光台 · 个人生活管理工作台</title>
<script>
/* PWA 注入：仅在线上（http/https）注册 manifest 与 Service Worker。
   本地双击（file://）时完全跳过，保证单文件离线打开零网络请求、零控制台报错。 */
(function(){
  if(location.protocol!=="http:"&&location.protocol!=="https:") return;
  var m=document.createElement("link");
  m.rel="manifest"; m.href="manifest.json";
  document.head.appendChild(m);
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
<!-- 本工作台为单文件本地优先应用：数据仅存浏览器 localStorage，可导出 JSON 备份；页面可部署至资料库获取在线链接，数据不上传服务器 -->
<style>
:root{
  /* ===== Apple × MUJI 设计 Token ===== */
  --bg:#FAFAF7;            /* 米白底 */
  --bg-soft:#F4F4F0;       /* 浅灰雾面 */
  --card:#FFFFFF;
  --ink:#2E2E2A;           /* 主文字 暖黑 */
  --ink-2:#6B6B64;         /* 次文字 */
  --ink-3:#9B9B93;         /* 弱提示 */
  --line:#E6E6DF;          /* 细边框 */
  --sage:#7C9070;          /* 鼠尾草绿 主色 */
  --sage-soft:#EEF1EA;
  --mist:#8FA3B8;          /* 雾蓝 */
  --mist-soft:#EDF1F5;
  --sand:#C9B99A;          /* 暖沙 */
  --sand-soft:#F6F1E7;
  --red:#C67B6E;           /* 支出红（低饱和） */
  --red-soft:#F8EEEC;
  --green:#7C9070;         /* 收入绿 */
  --r-sm:10px; --r-md:14px; --r-lg:18px;
  --shadow:0 1px 3px rgba(46,46,42,.06),0 4px 14px rgba(46,46,42,.04);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --side-w:236px; --side-w-collapsed:68px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--font);font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--sage)}
textarea{resize:vertical;min-height:72px}
label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
svg{display:block}
/* ===== 布局骨架：左侧固定导航（可折叠） ===== */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;height:100vh;width:var(--side-w);flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto;overflow-x:hidden;transition:width .22s ease;z-index:90;display:flex;flex-direction:column;overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:var(--sp-5);padding:0 4px;flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--sage);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-text{min-width:0;flex:1;overflow:hidden;transition:opacity .15s}
.brand-name{font-size:17px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--ink-3);white-space:nowrap}
.nav-toggle{width:26px;height:26px;min-height:0;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex-shrink:0;transition:transform .22s,background .15s;position:relative}
.nav-toggle::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px}
.nav-toggle:hover{background:var(--bg-soft)}
.nav-toggle svg{width:14px;height:14px}
#navList{flex:1;min-height:0}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-size:14px;margin-bottom:2px;text-align:left;transition:background .15s,color .15s,transform .12s;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.nav-item:hover{background:var(--bg-soft)}
.nav-item.active{background:var(--sage-soft);color:var(--sage);font-weight:500}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-label{white-space:nowrap;overflow:hidden;transition:opacity .15s}
.nav-group{font-size:11px;color:var(--ink-3);margin:var(--sp-4) var(--sp-2) var(--sp-2);letter-spacing:1px;white-space:nowrap}
.nav-item.locked{opacity:.45}
.nav-tag{margin-left:auto;font-size:10px;color:var(--ink-3);background:var(--bg-soft);padding:1px 6px;border-radius:6px;white-space:nowrap}
.nav-hint{font-size:11px;color:var(--ink-3);padding:8px 12px 2px;line-height:1.5;flex-shrink:0}
/* 拖动排序态 */
.nav-item.dragging{background:var(--sage-soft);color:var(--sage);box-shadow:0 6px 20px rgba(46,46,42,.14);transform:scale(1.02);position:relative;z-index:5;cursor:grabbing}
body.nav-dragging{cursor:grabbing}
body.nav-dragging .nav-item:not(.dragging){transition:transform .15s}
/* 折叠态 */
body.nav-collapsed .sidebar{width:var(--side-w-collapsed);padding-left:8px;padding-right:8px}
body.nav-collapsed .brand-text,
body.nav-collapsed .nav-label,
body.nav-collapsed .nav-tag,
body.nav-collapsed .nav-group,
body.nav-collapsed .nav-hint{display:none}
body.nav-collapsed .brand{flex-direction:column;gap:6px;padding:0}
body.nav-collapsed .nav-toggle{transform:rotate(180deg)}
body.nav-collapsed .nav-item{justify-content:center;padding:11px 0;gap:0}
body.nav-collapsed .nav-item svg{width:20px;height:20px}
/* 移动端展开时的遮罩 */
.nav-backdrop{display:none;position:fixed;inset:0;background:rgba(46,46,42,.28);z-index:85;opacity:0;transition:opacity .2s}
.nav-backdrop.show{display:block;opacity:1}
.main{margin-left:var(--side-w);flex:1;min-width:0;padding:var(--sp-5) var(--sp-6) var(--sp-6);transition:margin-left .22s ease}
body.nav-collapsed .main{margin-left:var(--side-w-collapsed)}
/* 折叠态悬停显示名称 */
.nav-item[data-tip]{position:relative}
body.nav-collapsed .nav-item:hover::after{content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:12px;padding:4px 10px;border-radius:6px;white-space:nowrap;z-index:95;pointer-events:none}
.topbar{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.search-wrap{position:relative;flex:1;max-width:420px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.search-wrap input{padding-left:36px;background:var(--bg-soft);border-color:transparent}
.top-actions{display:flex;gap:var(--sp-2);margin-left:auto}
.cloud-pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:border-color .15s}
.cloud-pill:hover{border-color:var(--ink-3)}
.cloud-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex-shrink:0}
.cloud-pill[data-s="ok"] .cloud-dot{background:var(--sage)}
.cloud-pill[data-s="syncing"] .cloud-dot{background:#d9a441;animation:pulseDot 1s infinite}
.cloud-pill[data-s="error"] .cloud-dot{background:#c2544d}
.cloud-pill[data-s="local"] .cloud-dot{background:#b0aca4}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}
@media (max-width:860px){.cloud-pill .cloud-txt{display:none}.cloud-pill{padding:0 10px}}
.view{display:none;animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-title{font-size:22px;font-weight:600;margin-bottom:2px}
.page-sub{font-size:13px;color:var(--ink-3);margin-bottom:var(--sp-5)}
/* ===== 卡片与网格 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-5);box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:600;margin-bottom:var(--sp-3);display:flex;align-items:center;gap:8px}
.card-title .sub{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:auto}
.grid{display:grid;gap:var(--sp-4)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:var(--r-sm);font-size:14px;font-weight:500;transition:opacity .15s,background .15s;border:1px solid transparent}
.btn:active{opacity:.8}
.btn-primary{background:var(--sage);color:#fff}
.btn-primary:hover{background:#6d8062}
.btn-ghost{border-color:var(--line);color:var(--ink-2);background:var(--card)}
.btn-ghost:hover{background:var(--bg-soft)}
.btn-danger{color:var(--red);border-color:var(--red-soft);background:var(--card)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn-icon{min-width:44px;padding:10px}
/* ===== 表格 ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg-soft);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.amount-exp{color:var(--red);font-weight:500;font-variant-numeric:tabular-nums}
.amount-inc{color:var(--green);font-weight:500;font-variant-numeric:tabular-nums}
/* ===== 标签 / 徽章 ===== */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--bg-soft);color:var(--ink-2)}
.chip.sage{background:var(--sage-soft);color:var(--sage)}
.chip.mist{background:var(--mist-soft);color:var(--mist)}
.chip.sand{background:var(--sand-soft);color:#9a8a68}
.chip.red{background:var(--red-soft);color:var(--red)}
/* ===== 进度条 ===== */
.progress{height:8px;border-radius:99px;background:var(--bg-soft);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--sage);transition:width .4s ease}
/* ===== 表单 ===== */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-4)}
.form-grid .full{grid-column:1/-1}
/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(46,46,42,.32);display:none;align-items:center;justify-content:center;z-index:100;padding:var(--sp-4)}
.modal-mask.open{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);padding:var(--sp-6);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 12px 40px rgba(46,46,42,.16);animation:fadeIn .2s ease}
.modal.wide{max-width:720px}
.modal-title{font-size:17px;font-weight:600;margin-bottom:var(--sp-4)}
.modal-actions{display:flex;justify-content:flex-end;gap:var(--sp-2);margin-top:var(--sp-5)}
/* ===== 提示条 ===== */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:14px;padding:10px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--sand-soft);border:1px solid #e8dfc9;color:#7a6c4d;font-size:13px;padding:10px 14px;border-radius:var(--r-sm);margin-bottom:var(--sp-4)}
.notice.mist{background:var(--mist-soft);border-color:#d8e0e9;color:#5d7186}
/* ===== 空状态 ===== */
.empty{text-align:center;padding:var(--sp-7) var(--sp-4);color:var(--ink-3)}
.empty svg{width:44px;height:44px;margin:0 auto var(--sp-3);opacity:.5}
.empty p{font-size:14px}
/* ===== 今天要处理 ===== */
.today-item{display:flex;align-items:center;gap:var(--sp-3);padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:var(--sp-2);background:var(--card)}
.today-item.overdue{border-color:#ecd4cf;background:var(--red-soft)}
.today-item .txt{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-item .meta{font-size:12px;color:var(--ink-3);flex-shrink:0}
.today-item .meta.over{color:var(--red);font-weight:500}
/* ===== 菜单周视图 ===== */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day-col{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.day-col.today{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage-soft)}
.day-title{font-size:12px;color:var(--ink-3);display:flex;align-items:baseline;gap:4px;margin-bottom:2px}
.day-title b{font-size:13px;color:var(--ink-2);font-weight:600}
.day-col.today .day-title b{color:var(--sage)}
.meal-label{font-size:10px;color:var(--ink-3);letter-spacing:.5px}
.meal-slot{border:1px dashed var(--line);border-radius:var(--r-sm);padding:6px 8px;font-size:13px;background:var(--bg);min-height:36px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:background .15s,border-color .15s;text-align:left;width:100%}
.meal-slot:hover{border-color:var(--sage);background:var(--sage-soft)}
.meal-slot.filled{border-style:solid;background:var(--sage-soft);border-color:#d5dfcb;color:var(--sage);font-weight:500}
.meal-slot .slot-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal-slot .slot-x{color:var(--ink-3);font-size:15px;line-height:1;padding:0 2px;flex-shrink:0}
.meal-slot .slot-x:hover{color:var(--red)}
/* ===== 菜谱 ===== */
.recipe-card{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--card);display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.recipe-card:hover{border-color:#d5dfcb}
.recipe-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.recipe-meta{font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.recipe-ings{font-size:12px;color:var(--ink-2);line-height:1.7;max-height:44px;overflow:hidden}
.ing-row{display:grid;grid-template-columns:1fr 110px 34px;gap:8px;margin-bottom:6px;align-items:center}
/* ===== 身体管理：月历 ===== */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:var(--sp-3);flex-wrap:wrap}
.cal-head .mon{font-size:16px;font-weight:600;min-width:110px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;color:var(--ink-3);text-align:center;padding:2px 0 4px}
.cal-cell{min-height:80px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s;overflow:hidden}
.cal-cell:hover{border-color:var(--sage);background:var(--bg)}
.cal-cell.blank{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cal-cell.today{border-color:var(--sage);box-shadow:0 0 0 2px var(--sage-soft)}
.cal-cell.has{background:var(--sage-soft);border-color:#d5dfcb}
.cal-d{font-size:12px;color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums}
.cal-cell.today .cal-d{color:var(--sage);font-weight:600}
.cal-w{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.cal-x{font-size:10px;color:var(--ink-3);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-x .dot{display:inline-block;width:5px;height:5px;border-radius:99px;background:var(--mist);margin-right:3px;vertical-align:1px}
/* ===== 愿望清单 ===== */
.wish-card{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--card);display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.wish-card:hover{border-color:#d5dfcb}
.wish-title{font-size:15px;font-weight:600;display:flex;align-items:flex-start;gap:6px;line-height:1.4}
.wish-title .done{color:var(--ink-3);text-decoration:line-through;font-weight:500}
.wish-meta{font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ===== 备考 ===== */
/* ===== 移动端适配 ===== */
@media (max-width:860px){
  :root{--side-w:220px;--side-w-collapsed:62px}
  .main{padding:var(--sp-4) var(--sp-4) calc(var(--sp-6) + env(safe-area-inset-bottom))}
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .page-title{font-size:19px}
  .search-wrap{max-width:none}
  .topbar{flex-wrap:wrap}
  .top-actions{margin-left:0;width:100%}
  /* 展开态在移动端浮层显示，不挤压正文 */
  body:not(.nav-collapsed) .sidebar{box-shadow:0 0 40px rgba(46,46,42,.16)}
  /* 菜单周视图：窄屏改为按天堆叠 */
  .week-grid{grid-template-columns:1fr}
  .day-col{min-height:0}
  .ing-row{grid-template-columns:1fr 90px 34px}
  /* 身体管理月历：窄屏压缩单元格 */
  .cal-cell{min-height:62px;padding:4px 4px;border-radius:8px;gap:2px}
  .cal-w{font-size:12px}
  .cal-x{font-size:9px}
  .cal-head .mon{font-size:15px;min-width:96px}
  .bd-ex-row{grid-template-columns:1fr .7fr .8fr 34px !important}
}
@media (max-width:480px){
  .grid-4{grid-template-columns:1fr 1fr}
}
</style>
</head>

<div class="app" data-sp-bindable="database" data-sp-database-id="ehkFv0Mu67uDkj6hq038sr">
  <!-- ===== 侧边导航 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3v10"/><path d="M12 13c-4 0-7 3-7 8h14c0-5-3-8-7-8z"/></svg>

      <div class="brand-text"><div class="brand-name">拾光台</div><div class="brand-sub">个人生活管理工作台</div></div>
      <button class="nav-toggle" id="navToggle" title="收起/展开导航" aria-label="收起或展开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>

/* ============================================================
 * 拾光台 · 数据层（localStorage，key 前缀 wb_life_）

const LS_PREFIX = "wb_life_";
const LS_KEYS = ["transactions","accounts","snapshots","goals","memos","shopping","collections","items","consumables","packTemplates","packingLists","trips","travelRows","recipes","mealPlans","health","wishes","settings"];

/* ---------- 数据层 ---------- */
function lsGet(key, fallback){
  try{ const raw = localStorage.getItem(LS_PREFIX+key); return raw?JSON.parse(raw):fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }

let state = {};
function loadState(){
  state = {

    accounts:     lsGet("accounts", []),

    memos:        lsGet("memos", []),

    collections:  lsGet("collections", []),
    items:        lsGet("items", []),
    consumables:  lsGet("consumables", []),
    packTemplates: lsGet("packTemplates", []),
    packingLists:  lsGet("packingLists", []),

    travelRows:    lsGet("travelRows", []),   // 行程明细 {id,tripId,date,time,place,activity,transport,lodging,budget,actual,status,note}
    recipes:       lsGet("recipes", []),      // 菜谱 {id,name,ingredients,steps,servings,minutes,difficulty,tags,source,note}

}
function save(key){
  lsSet(key, state[key]);

function monthStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }

/* ---------- 路由与导航 ---------- */
const ROUTES = [
  {id:"dashboard", name:"仪表盘", icon:"home", phase:1},
  {id:"finance",   name:"理财记账", icon:"wallet", phase:1},
  {id:"shopping",  name:"购物清单", icon:"cart", phase:1},
  {id:"memos",     name:"备忘提醒", icon:"note", phase:1},
  {id:"collections", name:"收藏夹", icon:"bookmark", phase:1},
  {id:"items",     name:"物品管理", icon:"box", phase:1},
  {id:"packing",   name:"行李打包", icon:"bag", phase:1},
  {id:"travel",    name:"旅游计划", icon:"plane", phase:1},
  {id:"meals",     name:"菜单日程", icon:"calendar", phase:1},
  {id:"recipes",   name:"菜谱管理", icon:"chef", phase:1},
  {id:"body",      name:"身体记录", icon:"heart", phase:1},
  {id:"sport",     name:"运动记录", icon:"pulse", phase:1},
  {id:"wishes",    name:"愿望清单", icon:"star", phase:1},
  {id:"settings",  name:"设置与备份", icon:"gear", phase:1}
];
let currentView = "dashboard";

/* ---------- 导航顺序：用户自定义优先，其余按默认 ---------- */
function orderedRoutes(){
  const order=(state.settings&&state.settings.navOrder)||[];
  const map=new Map(ROUTES.map(r=>[r.id,r]));
  const out=[];
  order.forEach(id=>{ if(map.has(id)){ out.push(map.get(id)); map.delete(id); } });
  ROUTES.forEach(r=>{ if(map.has(r.id)) out.push(map.get(r.id)); });
  return out;
}
function renderNav(){
  const list = document.getElementById("navList");
  const routes=orderedRoutes();
  const firstLockedIdx=routes.findIndex(r=>r.phase>1);
  let html = "";
  routes.forEach((r,idx)=>{
    if(idx===firstLockedIdx) html += '<div class="nav-group">后续迭代</div>';
    const locked = r.phase>1;
    html += '<button class="nav-item'+(currentView===r.id?" active":"")+(locked?" locked":"")+'" data-view="'+r.id+'" '
      +'data-tip="'+r.name+(locked?"（第 "+r.phase+" 期）":"")+'" '+(locked?'title="第 '+r.phase+' 期交付"':"")+'>'
      + ICONS[r.icon] + '<span class="nav-label">'+r.name+'</span>'
      + (locked?'<span class="nav-tag">'+r.phase+'期</span>':"") + '</button>';
  });
  list.innerHTML = html;
  initNavDrag();
  updateNavBackdrop();
}
/* ---------- 折叠 / 展开 ---------- */
function setNavCollapsed(v, silent){
  document.body.classList.toggle("nav-collapsed", !!v);
  state.settings.navCollapsed = !!v;
  save("settings");
  updateNavBackdrop();
  if(!silent) toast(v?"导航已收起":"导航已展开");
}
function updateNavBackdrop(){
  const bd=document.getElementById("navBackdrop");
  if(!bd) return;
  const isMobile=window.innerWidth<=860;
  const collapsed=document.body.classList.contains("nav-collapsed");
  if(isMobile && !collapsed) bd.classList.add("show"); else bd.classList.remove("show");
}
/* ---------- 长按拖动排序 ---------- */
const navDrag={timer:null, el:null, startY:0, active:false};
let navJustDragged=false;
function blockScroll(e){ if(navDrag.active) e.preventDefault(); }
function initNavDrag(){
  const list=document.getElementById("navList");
  if(!list || list.dataset.dragBound==="1") return;
  list.dataset.dragBound="1";

  list.addEventListener("pointerdown", e=>{
    const item=e.target.closest(".nav-item");
    if(!item) return;
    if(e.pointerType==="mouse" && e.button!==0) return;
    navDrag.el=item; navDrag.startY=e.clientY; navDrag.active=false;
    clearTimeout(navDrag.timer);
    navDrag.timer=setTimeout(()=>{
      navDrag.active=true;
      item.classList.add("dragging");
      document.body.classList.add("nav-dragging");
      if(navigator.vibrate) navigator.vibrate(12);
      window.addEventListener("touchmove", blockScroll, {passive:false});
      window.addEventListener("pointermove", onNavDragMove);
      window.addEventListener("pointerup", endNavDrag);
      window.addEventListener("pointercancel", endNavDrag);
    }, 350);
  });
  /* 未进入长按态时，移动超过阈值即取消计时，保证正常滑动不误触 */
  list.addEventListener("pointermove", e=>{
    if(!navDrag.active && Math.abs(e.clientY-navDrag.startY)>8) clearTimeout(navDrag.timer);
  });
  list.addEventListener("pointerup", ()=>{ if(!navDrag.active) clearTimeout(navDrag.timer); });
  list.addEventListener("pointercancel", ()=>{ if(!navDrag.active) clearTimeout(navDrag.timer); });
  list.addEventListener("contextmenu", e=>{ if(navDrag.active) e.preventDefault(); });
  /* 点击切换（删除/重排后仍有效，用事件委托） */
  list.addEventListener("click", e=>{
    const item=e.target.closest(".nav-item");
    if(!item) return;
    if(navJustDragged){ e.preventDefault(); return; }
    switchView(item.dataset.view);
  });
}
function onNavDragMove(e){
  if(!navDrag.active || !navDrag.el) return;
  e.preventDefault();
  const list=document.getElementById("navList");
  const y=e.clientY;
  const others=[...list.querySelectorAll(".nav-item:not(.dragging)")];
  let target=null;
  for(const s of others){
    const r=s.getBoundingClientRect();
    if(y < r.top + r.height/2){ target=s; break; }
  }
  if(target){ if(navDrag.el.nextElementSibling!==target) list.insertBefore(navDrag.el,target); }
  else if(list.lastElementChild!==navDrag.el) list.appendChild(navDrag.el);
}
function endNavDrag(){
  clearTimeout(navDrag.timer);
  window.removeEventListener("touchmove", blockScroll);
  window.removeEventListener("pointermove", onNavDragMove);
  window.removeEventListener("pointerup", endNavDrag);
  window.removeEventListener("pointercancel", endNavDrag);
  document.body.classList.remove("nav-dragging");
  if(navDrag.active && navDrag.el){
    navDrag.el.classList.remove("dragging");
    const list=document.getElementById("navList");
    /* 保留「后续迭代」分组前的顺序，直接存所有 nav 项 id */
    state.settings.navOrder=[...list.querySelectorAll(".nav-item")].map(b=>b.dataset.view);
    save("settings");
    navJustDragged=true;
    setTimeout(()=>{ navJustDragged=false; }, 320);
    toast("导航顺序已保存");
    refreshAll();
  }
  navDrag.active=false; navDrag.el=null;
}
function switchView(id){
  const r = ROUTES.find(x=>x.id===id);
  if(!r) return;
  if(r.phase>1){ toast("「"+r.name+"」将在第 "+r.phase+" 期迭代中交付"); return; }
  currentView = id;
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById("view-"+id).classList.add("active");
  /* 移动端选定后自动收起，避免遮挡正文 */
  if(window.innerWidth<=860 && !document.body.classList.contains("nav-collapsed")) setNavCollapsed(true,true);
  refreshAll();
}

/* ---------- 统一刷新入口（铁律：渲染函数互不调用） ---------- */
function refreshAll(){
  renderNav();
  renderDashboard();
  renderFinance();
  renderShopping();
  renderCollections();
  renderItems();
  renderPacking();
  renderTravel();
  renderMeals();
  renderRecipes();
  renderBody();
  renderSport();
  renderWishes();
  renderMemos();
  renderSettings();
}

/* ---------- 计算层：收支统计 ---------- */
function sumBy(fn){ return state.transactions.filter(fn).reduce((s,t)=>s+Number(t.amount),0); }
function monthIncome(ms){ return sumBy(t=>t.type==="income"&&t.date.startsWith(ms)); }
function monthExpense(ms){ return sumBy(t=>t.type==="expense"&&t.date.startsWith(ms)); }
function lastMonths(n){
  const arr=[], d=new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){ const t=new Date(d.getFullYear(),d.getMonth()-i,1); arr.push(monthStr(t)); }
  return arr;
}

/* ============================================================
 * 仪表盘
 * ============================================================ */
function renderDashboard(){
  const h=new Date().getHours();
  const greet = h<6?"夜深了":h<11?"早上好":h<14?"中午好":h<18?"下午好":"晚上好";
  document.getElementById("greetTitle").textContent = greet+"，今天也要好好生活";
  const now=new Date();
  document.getElementById("greetSub").textContent = now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日 · "+"日一二三四五六"[now.getDay()]+"曜日";

  /* 今天要处理：逾期/今日提醒 + 待买清单 */
  const td = todayStr();
  let items = [];
  state.memos.filter(m=>!m.done && m.remindAt && m.remindAt.slice(0,10)<=td).forEach(m=>{
    items.push({kind:"memo", over:m.remindAt.slice(0,10)<td, text:m.title, meta:m.remindAt.slice(0,10)<td?"已逾期":"今日提醒", id:m.id, btn:"完成"});
  });
  state.consumables.forEach(c=>{

  document.getElementById("todayCount").textContent = items.length?("共 "+items.length+" 项"):"";
  document.getElementById("todayList").innerHTML = items.length
    ? items.map(it=>'<div class="today-item'+(it.over?" overdue":"")+'"><span class="txt">'+esc(it.text)+'</span><span class="meta'+(it.over?" over":"")+'">'+esc(it.meta)+'</span><button class="btn btn-sm '+(it.kind==="memo"?"btn-primary":"btn-ghost")+'" data-kind="'+it.kind+'" data-id="'+it.id+'">'+it.btn+'</button></div>').join("")

  document.getElementById("todayList").querySelectorAll("button[data-kind]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.kind==="memo"){ const m=state.memos.find(x=>x.id===b.dataset.id); if(m){m.done=true; save("memos"); toast("已完成："+m.title);} }
    else if(b.dataset.kind==="cons"){ const c=state.consumables.find(x=>x.id===b.dataset.id); if(c){ c.lastReplaced=todayStr(); save("consumables"); toast("已记录更换："+c.name);} }
    else if(b.dataset.kind==="trip"){ tripCurId=b.dataset.id; switchView("travel"); return; }
    else { const s=state.shopping.find(x=>x.id===b.dataset.id); if(s){ s.purchased=true; s.purchaseDate=todayStr(); save("shopping"); toast("已标记购买："+s.name);} }
    refreshAll();
  }));

  /* 统计卡片 */
  const ms = monthStr(new Date());
  const inc=monthIncome(ms), exp=monthExpense(ms);
  const pendingShop = state.shopping.filter(s=>!s.purchased).length;
  const dueMemo = state.memos.filter(m=>!m.done&&m.remindAt&&m.remindAt.slice(0,10)<=td).length;
  const latestSnap = state.snapshots.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  document.getElementById("statCards").innerHTML = [
    {t:"本月收入", v:fmtMoney(inc), c:"var(--green)"},

/* ---------- SVG 图表：趋势柱状图 ---------- */
function renderTrendChart(el){
  const months=lastMonths(6);
  const data=months.map(m=>({m, inc:monthIncome(m), exp:monthExpense(m)}));
  const max=Math.max(1,...data.flatMap(d=>[d.inc,d.exp]));
  const W=520,H=210,padL=8,padB=28,padT=14;
  const bw=(W-padL-8)/months.length;
  let bars="",labels="";
  data.forEach((d,i)=>{
    const x=padL+i*bw+bw*0.15, w=bw*0.28;
    const hI=(d.inc/max)*(H-padB-padT), hE=(d.exp/max)*(H-padB-padT);
    bars+='<rect x="'+x+'" y="'+(H-padB-hI)+'" width="'+w+'" height="'+hI+'" rx="4" fill="#7C9070"><title>'+d.m+' 收入 '+fmtMoney(d.inc)+'</title></rect>';
    bars+='<rect x="'+(x+w+4)+'" y="'+(H-padB-hE)+'" width="'+w+'" height="'+hE+'" rx="4" fill="#C67B6E"><title>'+d.m+' 支出 '+fmtMoney(d.exp)+'</title></rect>';
    labels+='<text x="'+(padL+i*bw+bw/2)+'" y="'+(H-8)+'" font-size="11" fill="#9B9B93" text-anchor="middle">'+d.m.slice(5)+'月</text>';
  });
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+W+'" y2="'+(H-padB)+'" stroke="#E6E6DF"/>'+bars+labels+'</svg>'
    +'<div style="display:flex;gap:16px;font-size:12px;color:var(--ink-3);margin-top:6px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#7C9070;margin-right:5px"></i>收入</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#C67B6E;margin-right:5px"></i>支出</span></div>';
}

/* ---------- SVG 图表：支出饼图（环形，悬停看金额占比） ---------- */
function renderPieChart(el, ms){
  const catMap={};
  state.transactions.filter(t=>t.type==="expense"&&t.date.startsWith(ms)).forEach(t=>{ catMap[t.category]=(catMap[t.category]||0)+Number(t.amount); });
  const entries=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,e)=>s+e[1],0);
  if(!entries.length){ el.innerHTML='<div class="empty" style="padding:28px"><p>本月暂无支出记录</p></div>'; return; }
  const COLORS=["#7C9070","#8FA3B8","#C9B99A","#C67B6E","#A3B18A","#B5B8C9","#D6C6B4","#9BA8A0","#CBB4A0","#8B8B83"];
  const cx=90,cy=90,r=62,ir=38; let a0=-Math.PI/2, paths="";
  entries.slice(0,8).forEach((e,i)=>{
    const frac=e[1]/total, a1=a0+frac*2*Math.PI;
    const large=frac>0.5?1:0;
    const p=(a,r)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
    const [x0,y0]=p(a0,r),[x1,y1]=p(a1,r),[x2,y2]=p(a1,ir),[x3,y3]=p(a0,ir);
    paths+='<path d="M'+x0+' '+y0+' A'+r+' '+r+' 0 '+large+' 1 '+x1+' '+y1+' L'+x2+' '+y2+' A'+ir+' '+ir+' 0 '+large+' 0 '+x3+' '+y3+' Z" fill="'+COLORS[i%COLORS.length]+'"><title>'+esc(e[0])+' '+fmtMoney(e[1])+'（'+(frac*100).toFixed(1)+'%）</title></path>';
    a0=a1;
  });
  let legend=entries.slice(0,8).map((e,i)=>'<div style="display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0"><i style="width:10px;height:10px;border-radius:3px;background:'+COLORS[i%COLORS.length]+';flex-shrink:0"></i><span style="flex:1">'+esc(e[0])+'</span><span style="color:var(--ink-3);font-variant-numeric:tabular-nums">'+fmtMoney(e[1])+' · '+(e[1]/total*100).toFixed(0)+'%</span></div>').join("");
  el.innerHTML='<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:150px;flex-shrink:0">'+paths+'<text x="90" y="86" text-anchor="middle" font-size="11" fill="#9B9B93">总支出</text><text x="90" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#2E2E2A">'+fmtMoney(total)+'</text></svg><div style="flex:1;min-width:180px">'+legend+'</div></div>';
}

/* ---------- CSV 导入（列映射 + 预览 + 错误行） ---------- */
function parseCSV(text){
  const rows=[]; let row=[],field="",inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else if(c==='"') inQ=true;
    else if(c===','){ row.push(field); field=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(field); field=""; if(row.some(x=>x.trim()!=="")) rows.push(row); row=[]; }
    else field+=c;
  }
  if(field!==""||row.length){ row.push(field); if(row.some(x=>x.trim()!=="")) rows.push(row); }
  return rows;
}
function openCsvImportModal(){
  openModal('<div class="modal-title">导入 CSV 账单</div>'
    +'<div class="notice">支持支付宝/微信/银行导出的 CSV。第一步选择文件，第二步映射列（日期、金额、类型…），预览确认后写入。</div>'
    +'<input type="file" id="csvFile" accept=".csv,text/csv">'
    +'<div id="csvMapArea" style="margin-top:14px"></div>'
    +'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button></div>', true);
  document.getElementById("csvFile").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ csvMappingStep(parseCSV(rd.result)); };
    rd.readAsText(f,"UTF-8");
  };
}
function csvMappingStep(rows){
  if(rows.length<2){ toast("CSV 内容为空或缺少数据行"); return; }
  const header=rows[0], sample=rows.slice(1,6);
  const FIELDS=[["date","日期 *"],["amount","金额 *"],["type","类型（支出/收入）"],["category","分类"],["note","备注"],["account","账户"]];
  const guess=(keys)=>{ for(let i=0;i<header.length;i++){ const h=header[i]; if(keys.some(k=>h.includes(k))) return i; } return -1; };
  const pre={date:guess(["日期","时间","date"]), amount:guess(["金额","amount"]), type:guess(["类型","收/支","收支"]), category:guess(["分类","类别","交易类型"]), note:guess(["备注","说明","商品","交易对方"]), account:guess(["账户","支付方式"])};
  let html='<p style="font-size:13px;color:var(--ink-2);margin-bottom:10px">检测到 '+header.length+' 列、'+(rows.length-1)+' 行数据。请映射字段：</p>'
    +'<div class="form-grid">'
    +FIELDS.map(f=>'<div><label>'+f[1]+'</label><select data-field="'+f[0]+'"><option value="-1">（不导入）</option>'
      +header.map((h,i)=>'<option value="'+i+'"'+(pre[f[0]]===i?" selected":"")+'>'+esc(h||("列"+(i+1)))+'</option>').join("")+'</select></div>').join("")
    +'</div>'
    +'<p style="font-size:13px;color:var(--ink-2);margin:14px 0 6px">前 '+sample.length+' 行预览：</p>'
    +'<div class="tbl-wrap"><table><thead><tr>'+header.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'
    +sample.map(r=>'<tr>'+header.map((_,i)=>'<td>'+esc(r[i]||"")+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'
    +'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="csvDoImport">确认导入</button></div>';
  document.getElementById("csvMapArea").innerHTML=html;
  document.getElementById("csvDoImport").onclick=()=>{
    const map={};
    document.querySelectorAll("[data-field]").forEach(s=>{ map[s.dataset.field]=parseInt(s.value,10); });
    if(map.date<0||map.amount<0){ toast("日期和金额列必须映射"); return; }
    const errors=[]; let ok=0;
    rows.slice(1).forEach((r,idx)=>{
      const rawAmt=String(r[map.amount]||"").replace(/[¥￥,\s]/g,"");
      const amt=parseFloat(rawAmt);
      let dt=String(r[map.date]||"").trim().replace(/[./年]/g,"-").replace(/月/g,"-").replace(/日/g,"");
      const dm=dt.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if(!dm||!(amt>0)){ errors.push("第 "+(idx+2)+" 行：日期或金额无法识别（"+esc(String(r[map.date]||""))+" / "+esc(String(r[map.amount]||""))+"）"); return; }
      dt=dm[1]+"-"+dm[2].padStart(2,"0")+"-"+dm[3].padStart(2,"0");
      let type="expense";
      if(map.type>=0){ const tv=String(r[map.type]||""); if(/收|income|入/i.test(tv)&&!/支出/.test(tv)) type="income"; }
      state.transactions.push({id:uid(), date:dt, type:type, amount:amt,
        category:map.category>=0?String(r[map.category]||"").trim()||"其他支出":"其他支出",
        note:map.note>=0?String(r[map.note]||"").trim():"", account:map.account>=0?String(r[map.account]||"").trim():""});
      ok++;
    });
    save("transactions");
    if(errors.length){
      document.getElementById("csvMapArea").innerHTML='<div class="notice">成功导入 '+ok+' 条；'+errors.length+' 行被跳过：</div><div style="font-size:12px;color:var(--red);max-height:180px;overflow-y:auto">'+errors.slice(0,30).join("<br>")+'</div><div class="modal-actions"><button class="btn btn-primary" onclick="closeModal();refreshAll()">完成</button></div>';
    }else{ closeModal(); refreshAll(); toast("成功导入 "+ok+" 条记录"); }
  };
}

function renderSnapChart(el, snaps){
  if(snaps.length<2){ el.innerHTML='<div class="empty" style="padding:24px"><p>至少记录 2 次快照后生成曲线</p></div>'; return; }
  const W=520,H=190,padL=56,padB=26,padT=12;
  const vals=snaps.map(s=>Number(s.total));
  const min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min);
  const px=i=>padL+i*(W-padL-10)/(snaps.length-1);
  const py=v=>padT+(1-(v-min)/span)*(H-padB-padT);
  let line=snaps.map((s,i)=>(i?"L":"M")+px(i)+" "+py(s.total)).join(" ");
  let dots=snaps.map((s,i)=>'<circle cx="'+px(i)+'" cy="'+py(s.total)+'" r="4" fill="#7C9070"><title>'+s.date+' '+fmtMoney(s.total)+'</title></circle>').join("");
  let grid=[0,.5,1].map(f=>{const y=padT+f*(H-padB-padT);const v=max-f*span;
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#EFEFEA"/><text x="'+(padL-6)+'" y="'+(y+4)+'" font-size="10" fill="#9B9B93" text-anchor="end">'+Math.round(v/1000)+'k</text>';}).join("");
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+'<path d="'+line+'" fill="none" stroke="#7C9070" stroke-width="2" stroke-linecap="round"/>'+dots+'</svg>';
}

/* ============================================================
 * 模块 2：收藏夹（小红书 / 豆瓣笔记提取与分类）
 * 三种输入：粘贴文本智能解析 / 上传截图 / 手动录入；
 * 提取结果一律进入可编辑确认表单，不直接覆盖。
 * ============================================================ */
const COLL_TYPES = ["电影","书籍","文章","攻略","菜谱","灵感","其他"];
const COLL_STATUS = {todo:"待看", doing:"在看", done:"已看"};
const COLL_STATUS_READ = {todo:"待读", doing:"在读", done:"已读"};
function collStatusLabel(type, st){ return ((type==="书籍"||type==="文章")?COLL_STATUS_READ:COLL_STATUS)[st]||st; }
let collFilter = {q:"", platform:"all", type:"all", tag:"all", status:"all", view:"card"};

/* ---------- 智能解析：本地启发式，不发送任何数据 ---------- */
function parseNoteText(text){
  const t=(text||"").trim();
  const r={title:"", content:t, platform:"other", type:"其他", tags:[], link:""};
  if(!t) return r;
  /* 来源平台 */
  if(/xiaohongshu|xhslink|小红书/i.test(t)) r.platform="xhs";
  else if(/douban|豆瓣/i.test(t)) r.platform="douban";
  /* 链接 */
  const lm=t.match(/https?:\/\/[^\s)）]+/);
  if(lm) r.link=lm[0];
  /* 标题：取首个非空行（去掉链接行和纯标签行） */
  const lines=t.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  for(const ln of lines){
    if(/^https?:\/\//.test(ln)) continue;
    if(/^[#\s【\[\]0-9a-zA-Z]+$/.test(ln)&&ln.includes("#")) continue;
    r.title=ln.replace(/^[【\[]|[】\]]$/g,"").slice(0,60); break;
  }
  /* 话题标签：#xx# / #xx 空格 形态 */
  const tagSet=new Set();
  (t.match(/#([^#\s\[\]]{1,20})(?=#|\s|$|\[)/g)||[]).forEach(x=>tagSet.add(x.slice(1)));
  (t.match(/\[话题\]/g)||[]).length;
  r.tags=[...tagSet].slice(0,10);
  /* 类型猜测 */
  const kw=[["电影",/电影|影评|观影|院线|豆瓣电影/],["书籍",/书单|读书|书评|作者|出版社|豆瓣读书/],["菜谱",/菜谱|食谱|做法|食材|下锅|烤箱/],["攻略",/攻略|指南|教程|路线|行程|清单/],["文章",/公众号|文章|长文|专栏/],["灵感",/灵感|创意|想法|idea/i]];
  for(const [type,re] of kw){ if(re.test(t)){ r.type=type; break; } }
  return r;
}
/* ---------- 图片：压缩到 800px 宽 base64 ---------- */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image();
      img.onload=()=>{ const scale=Math.min(1,800/img.width);
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        resolve(cv.toDataURL("image/jpeg",0.72)); };
      img.onerror=reject; img.src=rd.result; };
    rd.onerror=reject; rd.readAsDataURL(file);
  });
}

    +'<div class="form-grid">'

    +'<div class="full"><label>标签（逗号分隔）</label><input id="cf2Tags" value="'+esc((d.tags||[]).join(","))+'"></div>'
    +'<div class="full"><label>正文</label><textarea id="cf2Content" style="min-height:110px">'+esc(d.content||"")+'</textarea></div>'

      link:document.getElementById("cf2Link").value.trim(),

    else{ state.collections.unshift(Object.assign({id:uid(),images:imgs,createdAt:todayStr()},rec)); }

/* ---------- 耗材更换提醒 ---------- */
function consNextDue(c){ return c.lastReplaced ? addDays(c.lastReplaced, Number(c.cycleDays)||30) : ""; }
function consStatus(c){
  const nd=consNextDue(c); if(!nd) return {label:"待记录",cls:"",days:null};
  const td=todayStr();
  if(nd<=td) return {label:"已到期",cls:"red",days:0};
  const diff=Math.round((new Date(nd)-new Date(td))/86400000);
  if(diff<=7) return {label:diff+" 天后到期",cls:"sand",days:diff};
  return {label:nd+" 更换",cls:"sage",days:diff};

/* ============================================================
 * 模块 5：旅游计划（多行程 + 行程表 + Excel 导入导出）
 * ============================================================ */
const TRIP_STATUS = [["plan","计划中"],["booked","已预订"],["done","已完成"],["skip","已取消"]];
const TRAVEL_HEAD = ["日期","时间","地点","活动","交通","住宿","预算","实际花费","状态","备注"];
const TRAVEL_FIELDS = [["date","日期 *"],["time","时间"],["place","地点"],["activity","活动"],["transport","交通"],["lodging","住宿"],["budget","预算"],["actual","实际花费"],["status","状态"],["note","备注"]];
let tripCurId = null;
let travelFilter = {q:"", status:"all"};

function p2(n){ return String(n).padStart(2,"0"); }
function tripStatusLabel(v){ const f=TRIP_STATUS.find(x=>x[0]===v); return f?f[1]:(v||"计划中"); }
function tripStatusKey(v){
  if(!v) return "plan";
  const raw=String(v).trim();
  const f=TRIP_STATUS.find(x=>x[0]===raw||x[1]===raw);
  if(f) return f[0];
  if(/完成|结束|去过/.test(raw)) return "done";
  if(/订|付|确认/.test(raw)) return "booked";
  if(/取消|放弃|不去/.test(raw)) return "skip";
  return "plan";
}
function curTrip(){
  const hit = state.trips.find(x=>x.id===tripCurId);
  if(hit) return hit;
  if(!state.trips.length) return null;
  const td = todayStr();
  const upcoming = state.trips.filter(x=>(x.startDate||"9999")>=td)
    .sort((a,b)=>(a.startDate||"").localeCompare(b.startDate||""))[0];
  const t = upcoming || state.trips.slice().sort((a,b)=>(b.startDate||"").localeCompare(a.startDate||""))[0];
  tripCurId = t.id;
  return t;
}
function tripDays(t){
  if(!t||!t.startDate||!t.endDate) return 1;
  const d = Math.round((new Date(t.endDate+"T00:00:00") - new Date(t.startDate+"T00:00:00"))/86400000)+1;
  return d>0?d:1;
}
function tripRows(tid){
  return state.travelRows.filter(r=>r.tripId===tid)
    .sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.time||"").localeCompare(b.time||""));
}
function sumField(rows, key){ return rows.reduce((s,r)=>s+(Number(r[key])||0),0); }

function renderTravel(){
  const el = document.getElementById("view-travel");
  if(!el.dataset.init){
    el.dataset.init="1";
    el.innerHTML = '<h1 class="page-title">旅游计划</h1><p class="page-sub">多行程行程表 · Excel 导入导出 · 可关联行李打包</p>'
      +'<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">'
      +'<button class="btn btn-ghost btn-sm" id="tvImport">导入 Excel</button>'
      +'<button class="btn btn-ghost btn-sm" id="tvExport">导出 Excel</button>'
      +'<button class="btn btn-ghost btn-sm" id="tvTpl">表头说明</button>'
      +'<span style="flex:1"></span>'
      +'<button class="btn btn-primary btn-sm" id="tvNewTrip">'+ICONS.plus+' 新建行程</button>'
      +'</div><div id="tvBody"></div>';
    document.getElementById("tvImport").onclick = openXlsxImportModal;
    document.getElementById("tvExport").onclick = exportTripXlsx;
    document.getElementById("tvTpl").onclick = showXlsxTemplateHint;
    document.getElementById("tvNewTrip").onclick = ()=>tripEditModal(null);
  }
  renderTravelBody();
}

function renderTravelBody(){
  const body = document.getElementById("tvBody");
  if(!state.trips.length){
    body.innerHTML = '<div class="card"><div class="empty">'+ICONS.plane
      +'<p>还没有行程。新建一个行程，或用 Excel 导入已有安排</p>'
      +'<div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'
      +'<button class="btn btn-primary btn-sm" id="tvEmptyNew">+ 新建行程</button>'
      +'<button class="btn btn-ghost btn-sm" id="tvEmptyImport">导入 Excel</button></div></div></div>';
    document.getElementById("tvEmptyNew").onclick = ()=>tripEditModal(null);
    document.getElementById("tvEmptyImport").onclick = openXlsxImportModal;
    return;
  }
  const t = curTrip();
  const all = tripRows(t.id);
  const sharedPacks = state.packingLists.filter(l=>l.tripId===t.id);

  /* 行程切换 */
  let html = '<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch">'
    + state.trips.slice().sort((a,b)=>(b.startDate||"").localeCompare(a.startDate||"")).map(x=>
        '<button class="btn btn-sm '+(x.id===t.id?"btn-primary":"btn-ghost")+'" data-trip="'+x.id+'" style="flex-shrink:0">'
        + esc(x.name||"未命名行程")+'</button>').join("")
    + '</div>';

  /* 行程概览 */
  html += '<div class="card" style="margin-bottom:14px">'
    +'<div class="card-title">'+esc(t.name||"未命名行程")
      +'<span class="sub" style="margin-left:auto;display:flex;gap:6px">'
      +'<button class="btn btn-sm btn-ghost" id="tvEditTrip">编辑行程</button>'
      +'<button class="btn btn-sm btn-ghost" id="tvPack">生成打包清单</button>'
      +'<button class="btn btn-sm btn-ghost" id="tvDelTrip" style="color:var(--red)">删除</button>'
      +'</span></div>'
    +'<div style="font-size:13px;color:var(--ink-2);display:flex;gap:18px;flex-wrap:wrap">'
      +'<span>目的地：'+esc(t.destination||"—")+'</span>'
      +'<span>时间：'+(t.startDate||"—")+' → '+(t.endDate||"—")+'（'+tripDays(t)+' 天）</span>'
      +(t.note?'<span>备注：'+esc(t.note)+'</span>':"")
      +(sharedPacks.length?'<span style="color:var(--sage)">已关联打包清单：'+esc(sharedPacks.map(p=>p.name).join("、"))+'</span>':"")
    +'</div></div>';

  /* 统计 */
  const budget = sumField(all,"budget"), actual = sumField(all,"actual");
  const tBudget = Number(t.budget)||0;
  html += '<div class="grid grid-4" style="margin-bottom:14px">'
    +'<div class="card" style="padding:14px"><div style="font-size:12px;color:var(--ink-3)">行程天数</div><div style="font-size:19px;font-weight:600">'+tripDays(t)+' 天</div></div>'
    +'<div class="card" style="padding:14px"><div style="font-size:12px;color:var(--ink-3)">明细预算合计</div><div style="font-size:19px;font-weight:600">'+fmtMoney(budget)+'</div></div>'
    +'<div class="card" style="padding:14px"><div style="font-size:12px;color:var(--ink-3)">实际花费</div><div style="font-size:19px;font-weight:600;color:var(--red)">'+fmtMoney(actual)+'</div></div>'
    +'<div class="card" style="padding:14px"><div style="font-size:12px;color:var(--ink-3)">'+(tBudget?"总预算结余":"预算 vs 实花")+'</div>'
      +'<div style="font-size:19px;font-weight:600;color:'+((tBudget?(tBudget-actual):(budget-actual))>=0?"var(--sage)":"var(--red)")+'">'
      +fmtMoney(tBudget?(tBudget-actual):(budget-actual))+'</div></div>'
    +'</div>';

  /* 过滤条 */
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'
    +'<input style="max-width:200px" id="tvQ" placeholder="搜索地点/活动/备注" value="'+esc(travelFilter.q)+'">'
    +'<select style="max-width:130px" id="tvStatus"><option value="all">全部状态</option>'
      +TRIP_STATUS.map(s=>'<option value="'+s[0]+'">'+s[1]+'</option>').join("")+'</select>'
    +'<span style="flex:1"></span>'
    +'<button class="btn btn-primary btn-sm" id="tvAddRow">'+ICONS.plus+' 新增日程</button>'
    +'</div>';

  let list = all.slice();
  if(travelFilter.q) list = list.filter(r=>[r.place,r.activity,r.note,r.transport,r.lodging].some(v=>String(v||"").includes(travelFilter.q)));
  if(travelFilter.status!=="all") list = list.filter(r=>tripStatusKey(r.status)===travelFilter.status);

  if(!all.length){
    html += '<div class="card"><div class="empty">'+ICONS.plane+'<p>这个行程还没有安排，点「新增日程」或导入 Excel</p></div></div>';
  }else if(!list.length){
    html += '<div class="card"><div class="empty"><p>没有符合筛选条件的日程</p></div></div>';
  }else{
    html += '<div class="tbl-wrap"><table style="min-width:1000px"><thead><tr>'
      +'<th>日期</th><th>时间</th><th>地点</th><th>活动</th><th>交通</th><th>住宿</th>'
      +'<th style="text-align:right">预算</th><th style="text-align:right">实际</th><th>状态</th><th>备注</th><th></th></tr></thead><tbody>';
    list.forEach(r=>{
      const st = tripStatusKey(r.status);
      const chip = st==="done"?"sage":st==="skip"?"":st==="booked"?"mist":"sand";
      html += '<tr><td style="white-space:nowrap">'+esc(r.date||"—")+'</td>'
        +'<td style="white-space:nowrap;color:var(--ink-2)">'+esc(r.time||"—")+'</td>'
        +'<td>'+esc(r.place||"—")+'</td>'
        +'<td>'+esc(r.activity||"—")+'</td>'
        +'<td style="color:var(--ink-3)">'+esc(r.transport||"—")+'</td>'
        +'<td style="color:var(--ink-3)">'+esc(r.lodging||"—")+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums">'+(r.budget!==""&&r.budget!=null?fmtMoney(r.budget):"—")+'</td>'
        +'<td style="text-align:right;font-variant-numeric:tabular-nums;color:'+(Number(r.actual)>Number(r.budget||0)?"var(--red)":"var(--ink-2)")+'">'+(r.actual!==""&&r.actual!=null?fmtMoney(r.actual):"—")+'</td>'
        +'<td><span class="chip '+chip+'">'+tripStatusLabel(st)+'</span></td>'
        +'<td style="color:var(--ink-3);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.note||"—")+'</td>'
        +'<td style="white-space:nowrap"><button class="btn btn-sm btn-ghost btn-icon" data-tv-edit="'+r.id+'" title="编辑">'+ICONS.edit+'</button> '
        +'<button class="btn btn-sm btn-ghost btn-icon" data-tv-del="'+r.id+'" title="删除">'+ICONS.trash+'</button></td></tr>';
    });
    html += '</tbody></table></div>'
      +'<p style="font-size:12px;color:var(--ink-3);margin-top:8px">共 '+list.length+' 条安排，按日期+时间排序</p>';
  }
  body.innerHTML = html;

  /* 事件绑定 */
  body.querySelectorAll("[data-trip]").forEach(b=>b.onclick=()=>{ tripCurId=b.dataset.trip; renderTravelBody(); });
  document.getElementById("tvEditTrip").onclick = ()=>tripEditModal(t.id);
  document.getElementById("tvDelTrip").onclick = ()=>confirmDanger("删除整个行程","将同时删除该行程下的 "+all.length+" 条日程安排，不可恢复。",()=>{
    state.trips = state.trips.filter(x=>x.id!==t.id);
    state.travelRows = state.travelRows.filter(r=>r.tripId!==t.id);
    tripCurId = null; save("trips"); save("travelRows"); refreshAll(); toast("已删除行程");
  });
  document.getElementById("tvPack").onclick = ()=>tripToPacking(t.id);
  document.getElementById("tvAddRow").onclick = ()=>travelRowModal(null);
  const q = document.getElementById("tvQ");
  q.oninput = e=>{ travelFilter.q=e.target.value; renderTravelBody(); const nq=document.getElementById("tvQ"); nq.focus(); nq.setSelectionRange(nq.value.length,nq.value.length); };
  const sel = document.getElementById("tvStatus"); sel.value = travelFilter.status;
  sel.onchange = e=>{ travelFilter.status=e.target.value; renderTravelBody(); };
  body.querySelectorAll("[data-tv-edit]").forEach(b=>b.onclick=()=>travelRowModal(b.dataset.tvEdit));
  body.querySelectorAll("[data-tv-del]").forEach(b=>b.onclick=()=>confirmDanger("删除这条日程","删除后不可恢复。",()=>{
    state.travelRows = state.travelRows.filter(r=>r.id!==b.dataset.tvDel);
    save("travelRows"); refreshAll(); toast("已删除");
  }));
}

/* ---------- 行程增删改 ---------- */
function tripEditModal(id){
  const t = id ? state.trips.find(x=>x.id===id) : null;
  const d = t || {name:"", destination:"", startDate:todayStr(), endDate:addDays(todayStr(),2), budget:"", note:""};
  openModal('<div class="modal-title">'+(t?"编辑行程":"新建行程")+'</div>'
    +'<div><label>行程名称 *</label><input id="trName" value="'+esc(d.name)+'" placeholder="如：京都 5 日 / 国庆回老家"></div>'
    +'<div style="margin-top:12px"><label>目的地</label><input id="trDest" value="'+esc(d.destination||"")+'" placeholder="城市 / 国家"></div>'
    +'<div class="form-grid" style="margin-top:12px">'
    +'<div><label>出发日期</label><input type="date" id="trStart" value="'+(d.startDate||"")+'"></div>'
    +'<div><label>返回日期</label><input type="date" id="trEnd" value="'+(d.endDate||"")+'"></div>'
    +'<div><label>总预算（元）</label><input type="number" inputmode="decimal" min="0" step="0.01" id="trBudget" value="'+(d.budget||"")+'" placeholder="可选"></div>'
    +'<div><label>备注</label><input id="trNote" value="'+esc(d.note||"")+'" placeholder="可选"></div>'
    +'</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn btn-primary" id="trSave">保存</button></div>');
  document.getElementById("trSave").onclick=()=>{
    const name = document.getElementById("trName").value.trim();
    if(!name){ toast("请填写行程名称"); return; }
    let sd = document.getElementById("trStart").value, ed = document.getElementById("trEnd").value;
    if(sd&&ed&&ed<sd){ const tmp=sd; sd=ed; ed=tmp; toast("起止日期已自动对调"); }
    const rec = {name:name, destination:document.getElementById("trDest").value.trim(),
      startDate:sd, endDate:ed, budget:document.getElementById("trBudget").value, note:document.getElementById("trNote").value.trim()};
    if(t){ Object.assign(t, rec); }
    else { const nt = Object.assign({id:uid()}, rec); state.trips.push(nt); tripCurId = nt.id; }
    save("trips"); closeModal(); refreshAll(); toast("行程已保存");
  };
}

    +'<div><label>实际花费（元）</label><input type="number" inputmode="decimal" min="0" step="0.01" id="tvActual" value="'+(r.actual||"")+'"></div>'
    +'<div><label>状态</label><select id="tvSt">'+opts+'</select></div>'
    +'<div class="full"><label>备注</label><input id="tvNote" value="'+esc(r.note||"")+'" placeholder="门票、预约号、注意事项…"></div>'
    +'</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn btn-primary" id="tvSaveRow">保存</button></div>');
  document.getElementById("tvSaveRow").onclick=()=>{
    const date = document.getElementById("tvDate").value;
    if(!date){ toast("请选择日期"); return; }
    const rec = {tripId:(t?t.id:null), date:date, time:document.getElementById("tvTime").value,
      place:document.getElementById("tvPlace").value.trim(),
      activity:document.getElementById("tvAct").value.trim(),
      transport:document.getElementById("tvTrans").value.trim(),
      lodging:document.getElementById("tvLodge").value.trim(),
      budget:document.getElementById("tvBudget").value,
      actual:document.getElementById("tvActual").value,
      status:document.getElementById("tvSt").value,
      note:document.getElementById("tvNote").value.trim()};
    if(id) Object.assign(state.travelRows.find(x=>x.id===id), rec);
    else state.travelRows.push(Object.assign({id:uid()}, rec));
    save("travelRows"); closeModal(); refreshAll(); toast("日程已保存");
  };
}

/* ---------- 关联行李打包 ---------- */
function tripToPacking(tid){
  const t = state.trips.find(x=>x.id===tid);
  if(!t) return;
  const tpls = state.packTemplates;
  if(!tpls.length){ toast("还没有打包模板，请先到「行李打包」建一个"); return; }
  openModal('<div class="modal-title">为「'+esc(t.name)+'」生成打包清单</div>'
    +'<div class="notice">按模板复制一份新清单，物品可再增减，不会改动模板本身。</div>'
    +'<div><label>选择模板</label><select id="tpTpl">'+tpls.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+'（'+x.items.length+' 项）</option>').join("")+'</select></div>'
    +'<div style="margin-top:12px"><label>清单名称</label><input id="tpName" value="'+esc(t.name+" 打包清单")+'"></div>'
    +'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn btn-primary" id="tpOk">生成并打开</button></div>');
  document.getElementById("tpOk").onclick=()=>{
    const i = parseInt(document.getElementById("tpTpl").value,10)||0;
    const tpl = tpls[i];
    const name = document.getElementById("tpName").value.trim() || (t.name+" 打包清单");
    const list = {id:uid(), name:name, date:t.startDate||todayStr(), tripId:t.id, createdAt:todayStr(),
      items:(tpl?tpl.items:[]).map(x=>({id:uid(), name:x.name, category:x.category, qty:x.qty||1, note:x.note||"", checked:false}))};
    state.packingLists.push(list); save("packingLists");
    packCurrentId = list.id;
    closeModal(); switchView("packing"); toast("已生成打包清单："+name);
  };
}

/* ---------- 自研 XLSX 编解码：手写 ZIP + SpreadsheetML，零外部依赖 ----------
 * 导出：生成 store（不压缩）模式的 ZIP 包，Excel / WPS / Numbers 均可直接打开
 * 导入：读中央目录，method 0 直读、method 8 用原生 DecompressionStream 解压
 * 说明：不引 SheetJS，避免外链库 404 导致整个功能失效（铁律 3）
 * ------------------------------------------------------------ */
const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[i]=c>>>0; }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function xmlEsc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
}
function xlCol(i){ let s="", n=i+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }

function sheetXml(aoa, opts){
  opts = opts || {};
  const isDate = i=>(opts.dateCols||[]).indexOf(i)>=0;
  const isTime = i=>(opts.timeCols||[]).indexOf(i)>=0;
  const rows = aoa.map((row,ri)=>{
    const cells = row.map((v,ci)=>{
      const ref = xlCol(ci)+(ri+1);
      if(v===null||v===undefined||v==="") return '<c r="'+ref+'"/>';
      /* 日期/时间写成真实 Excel 日期值（带数字格式），便于在 Excel 里排序筛选 */
      if(isDate(ci)){
        const n = dateStrToSerial(v);
        if(n!=null) return '<c r="'+ref+'" s="1"><v>'+n+'</v></c>';
      }
      if(isTime(ci)){
        const f = timeStrToFraction(v);
        if(f!=null) return '<c r="'+ref+'" s="2"><v>'+f+'</v></c>';
      }
      if(typeof v==="number"&&isFinite(v)) return '<c r="'+ref+'"><v>'+v+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>';
    }).join("");
    return '<row r="'+(ri+1)+'">'+cells+'</row>';
  }).join("");
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows+'</sheetData></worksheet>';
}

function dateStrToSerial(ds){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ds||"").trim());
  if(!m) return null;
  const t = Date.UTC(+m[1], +m[2]-1, +m[3]);
  if(!isFinite(t)) return null;
  return Math.round((t - Date.UTC(1899,11,30))/86400000);
}
function timeStrToFraction(ts){
  const m = /^(\d{1,2}):(\d{2})/.exec(String(ts||"").trim());
  if(!m) return null;
  const mins = (+m[1])*60 + (+m[2]);
  return mins>0 && mins<=1440 ? mins/1440 : null;
}

function zipStore(files){
  const enc = new TextEncoder();
  const now = new Date();
  const dtime = ((now.getHours()<<11) | (now.getMinutes()<<5) | Math.floor(now.getSeconds()/2)) & 0xFFFF;
  const ddate = (((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate()) & 0xFFFF;
  const locals = [], centrals = [];
  let offset = 0;
  files.forEach(f=>{
    const nameBytes = enc.encode(f.name);
    const crc = crc32(f.data), size = f.data.length;
    const lh = new Uint8Array(30 + nameBytes.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true); lv.setUint16(10, dtime, true); lv.setUint16(12, ddate, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, size, true); lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true); lv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);

    const ch = new Uint8Array(46 + nameBytes.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, dtime, true); cv.setUint16(14, ddate, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true); cv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);

    locals.push(lh, f.data); centrals.push(ch);
    offset += lh.length + size;
  });
  const cdSize = centrals.reduce((s,c)=>s+c.length,0);
  const eocd = new Uint8Array(22), ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);

  const all = locals.concat(centrals, [eocd]);
  const total = all.reduce((s,u)=>s+u.length,0);
  const out = new Uint8Array(total); let p = 0;
  all.forEach(u=>{ out.set(u, p); p += u.length; });
  return out;
}

function buildXlsx(sheets){
  const enc = new TextEncoder();
  const safeName = n=>String(n||"Sheet").replace(/[\[\]\*\/\\\?:]/g,"_").slice(0,31) || "Sheet";
  const parts = [];
  parts.push({name:"[Content_Types].xml", text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    + sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("")
    +'</Types>'});
  parts.push({name:"_rels/.rels", text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    +'</Relationships>'});
  parts.push({name:"xl/workbook.xml", text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
    + sheets.map((s,i)=>'<sheet name="'+xmlEsc(safeName(s.name))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join("")
    +'</sheets></workbook>'});
  parts.push({name:"xl/_rels/workbook.xml.rels", text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")
    +'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    +'</Relationships>'});
  parts.push({name:"xl/styles.xml", text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<numFmts count="2"><numFmt numFmtId="164" formatCode="yyyy-mm-dd"/><numFmt numFmtId="165" formatCode="hh:mm"/></numFmts>'
    +'<fonts count="1"><font><sz val="11"/><name val="PingFang SC"/></font></fonts>'
    +'<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
    +'<borders count="1"><border/></borders>'
    +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    +'<cellXfs count="3">'
    +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    +'<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
    +'<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
    +'</cellXfs>'
    +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
    +'</styleSheet>'});
  sheets.forEach((s,i)=>parts.push({name:"xl/worksheets/sheet"+(i+1)+".xml", text:sheetXml(s.aoa, s)}));
  return zipStore(parts.map(p=>({name:p.name, data:enc.encode(p.text)})));
}

function downloadBlob(blob, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

function textOfEl(el){
  const ts = el.getElementsByTagName("t"); let s="";
  for(let i=0;i<ts.length;i++) s += ts[i].textContent;
  return s;
}
function colIdxFromRef(ref){
  const m = /^([A-Za-z]+)/.exec(ref||""); if(!m) return 0;
  let n = 0; for(const ch of m[1].toUpperCase()) n = n*26 + (ch.charCodeAt(0)-64);
  return n-1;
}
function parseSheetXml(xml, shared){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("工作表内容解析失败");
  const rowEls = doc.getElementsByTagName("row");
  const out = [];
  for(let i=0;i<rowEls.length;i++){
    const cs = rowEls[i].getElementsByTagName("c");
    const cells = []; let auto = 0;
    for(let j=0;j<cs.length;j++){
      const c = cs[j], t = c.getAttribute("t"), ref = c.getAttribute("r");
      const idx = ref ? colIdxFromRef(ref) : auto;
      auto = idx + 1;
      const vEl = c.getElementsByTagName("v")[0];
      const isEl = c.getElementsByTagName("is")[0];
      let val = "";
      if(t==="inlineStr") val = isEl ? textOfEl(isEl) : (vEl?vEl.textContent:"");
      else if(vEl){
        val = vEl.textContent;
        if(t==="s") val = shared[parseInt(val,10)] ?? "";
        else if(t==="b") val = val==="1" ? "TRUE" : "FALSE";
      }
      else if(isEl) val = textOfEl(isEl);
      cells[idx] = val;
    }
    if(cells.some(x=>x!=null && String(x).trim()!=="")) out.push(cells);
  }
  return out;
}

/* deflate-raw 解压（只用原生 DecompressionStream，不依赖 Blob/Response） */
async function inflateRaw(raw){
  const ds = new DecompressionStream("deflate-raw");
  const writer = ds.writable.getWriter();
  writer.write(raw);
  writer.close();
  const reader = ds.readable.getReader();
  const chunks = []; let total = 0;
  for(;;){
    const res = await reader.read();
    if(res.done) break;
    chunks.push(res.value); total += res.value.length;
  }
  const out = new Uint8Array(total); let p = 0;
  chunks.forEach(c=>{ out.set(c, p); p += c.length; });
  return out;
}

async function parseXlsxToAoa(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for(let i=u8.length-22; i>=Math.max(0, u8.length-66000); i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("不是有效的 .xlsx 文件（未找到 ZIP 目录）");
  const count = dv.getUint16(eocd+10, true), cdOff = dv.getUint32(eocd+16, true);
  const entries = {}; let p = cdOff;
  for(let i=0;i<count;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method = dv.getUint16(p+10, true), csize = dv.getUint32(p+20, true);
    const nl = dv.getUint16(p+28, true), el = dv.getUint16(p+30, true), cl = dv.getUint16(p+32, true);
    const lho = dv.getUint32(p+42, true);
    const name = new TextDecoder().decode(u8.subarray(p+46, p+46+nl));
    entries[name] = {method, csize, lho};
    p += 46 + nl + el + cl;
  }
  const readText = async name=>{
    const e = entries[name]; if(!e) return null;
    const nl = dv.getUint16(e.lho+26, true), el = dv.getUint16(e.lho+28, true);
    const start = e.lho + 30 + nl + el;
    const raw = u8.subarray(start, start + e.csize);
    if(e.method===0) return new TextDecoder().decode(raw);
    if(e.method!==8) throw new Error("不支持的压缩方式，请用 Excel 另存为 .xlsx 或 CSV");
    if(typeof DecompressionStream==="undefined") throw new Error("当前浏览器不支持解压 xlsx，请把文件另存为 CSV 再导入");
    const buf = await inflateRaw(raw);
    return new TextDecoder().decode(buf);
  };

  /* 定位第一个工作表：优先按 workbook.xml 的 sheet 顺序 */
  let sheetName = null;
  try{
    const wb = await readText("xl/workbook.xml");
    const rels = await readText("xl/_rels/workbook.xml.rels");
    if(wb && rels){
      const m = /<sheet[^>]*r:id="([^"]+)"/.exec(wb);
      if(m){
        const relRe = /<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g; let r;
        while((r = relRe.exec(rels))){
          if(r[1]===m[1]){
            let tgt = r[2].replace(/^\/?xl\//,"").replace(/^\//,"");
            sheetName = "xl/" + tgt; break;
          }
        }
      }
    }
  }catch(e){ /* 忽略，走兜底 */ }
  if(!sheetName || !entries[sheetName]){
    const cands = Object.keys(entries).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort();
    sheetName = cands[0];
  }
  if(!sheetName) throw new Error("文件里没有找到工作表");

  let shared = [];
  const ssXml = await readText("xl/sharedStrings.xml");
  if(ssXml){
    const doc = new DOMParser().parseFromString(ssXml, "application/xml");
    const sis = doc.getElementsByTagName("si");
    for(let i=0;i<sis.length;i++) shared.push(textOfEl(sis[i]));
  }
  const xml = await readText(sheetName);
  return parseSheetXml(xml, shared);
}

/* ---------- 单元格值归一化 ---------- */
function xlSerialToDate(n){
  const d = new Date(Date.UTC(1899,11,30) + Math.floor(n)*86400000);
  return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate());
}
function normalizeDate(v){
  if(v===null||v===undefined||v==="") return null;
  if(typeof v==="number"){
    if(v>1000 && v<80000) return xlSerialToDate(v);
    return null;
  }
  let s = String(v).trim();
  if(!s) return null;
  if(/^\d{5}(\.\d+)?$/.test(s)) return xlSerialToDate(parseFloat(s));
  s = s.replace(/[./年]/g,"-").replace(/月/g,"-").replace(/日/g,"").replace(/\s+.*$/,"");
  const m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m) return null;
  const mo = +m[2], da = +m[3];
  if(mo<1||mo>12||da<1||da>31) return null;
  return m[1]+"-"+p2(mo)+"-"+p2(da);
}
function normalizeTime(v){
  if(v===null||v===undefined||v==="") return "";
  if(typeof v==="number"){
    if(v>=0 && v<1){ const mins=Math.round(v*1440); return p2(Math.floor(mins/60))+":"+p2(mins%60); }
    return String(v);
  }
  const s = String(v).trim();
  if(!s) return "";
  let m = s.match(/(\d{1,2})[:：](\d{2})/);
  if(m) return p2(m[1])+":"+m[2];
  if(/^0\.\d+$/.test(s)){ const mins=Math.round(parseFloat(s)*1440); return p2(Math.floor(mins/60))+":"+p2(mins%60); }
  if(/^\d{1,2}$/.test(s)) return p2(s)+":00";
  return s;
}
function cleanMoney(v){
  if(v===null||v===undefined||v==="") return "";
  const n = Number(String(v).replace(/[¥￥,，\s元]/g,""));
  return isFinite(n) && String(v).replace(/[¥￥,，\s元]/g,"")!=="" ? n : "";
}

function travelMappingStep(rows){

    return;
  }

  const sample = rows.slice(1,6);
  const guess = keys=>{ for(let i=0;i<header.length;i++){ if(keys.some(k=>header[i].includes(k))) return i; } return -1; };
  const pre = {
    date:guess(["日期","date"]), time:guess(["时间","时刻"]), place:guess(["地点","位置","景点"]),
    activity:guess(["活动","安排","行程","内容"]), transport:guess(["交通","出行"]), lodging:guess(["住宿","酒店"]),
    budget:guess(["预算"]), actual:guess(["实际","花费"]), status:guess(["状态"]), note:guess(["备注","说明"])
  };
  let html = '<p style="font-size:13px;color:var(--ink-2);margin-bottom:10px">识别到 '+header.length+' 列、'+(rows.length-1)+' 行数据，请确认列映射（日期必填）：</p>'

      + header.map((h,i)=>'<option value="'+i+'"'+(pre[f[0]]===i?" selected":"")+'>'+esc(h||("列"+(i+1)))+'</option>').join("")
      + '</select></div>').join("")
    +'</div>'
    +'<p style="font-size:13px;color:var(--ink-2);margin:14px 0 6px">前 '+sample.length+' 行预览：</p>'
    +'<div class="tbl-wrap"><table><thead><tr>'+header.map((h,i)=>'<th>'+esc(h||("列"+(i+1)))+'</th>').join("")+'</tr></thead><tbody>'
    + sample.map(r=>'<tr>'+header.map((_,i)=>'<td style="white-space:nowrap">'+esc(r[i]==null?"":r[i])+'</td>').join("")+'</tr>').join("")
    +'</tbody></table></div>'
    +'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn btn-primary" id="xlDoImport">确认导入</button></div>';
  area.innerHTML = html;

  document.getElementById("xlDoImport").onclick = ()=>{
    const map = {};
    document.querySelectorAll("[data-tvfield]").forEach(s=>{ map[s.dataset.tvfield] = parseInt(s.value,10); });
    if(map.date<0){ toast("必须映射「日期」列"); return; }
    let t = curTrip();
    if(!t){
      t = {id:uid(), name:"导入的行程", destination:"", startDate:"", endDate:"", budget:"", note:""};
      state.trips.push(t); tripCurId = t.id;
    }
    const errors = []; let ok = 0, minD = "", maxD = "";
    rows.slice(1).forEach((r,idx)=>{
      const rawDate = r[map.date];
      const date = normalizeDate(rawDate);
      if(!date){
        errors.push("第 "+(idx+2)+" 行：日期无法识别（"+esc(String(rawDate==null?"":rawDate))+"）");
        return;
      }
      state.travelRows.push({
        id:uid(), tripId:t.id, date:date,
        time: map.time>=0 ? normalizeTime(r[map.time]) : "",
        place: map.place>=0 ? String(r[map.place]==null?"":r[map.place]).trim() : "",
        activity: map.activity>=0 ? String(r[map.activity]==null?"":r[map.activity]).trim() : "",
        transport: map.transport>=0 ? String(r[map.transport]==null?"":r[map.transport]).trim() : "",
        lodging: map.lodging>=0 ? String(r[map.lodging]==null?"":r[map.lodging]).trim() : "",
        budget: map.budget>=0 ? cleanMoney(r[map.budget]) : "",
        actual: map.actual>=0 ? cleanMoney(r[map.actual]) : "",
        status: map.status>=0 ? tripStatusKey(r[map.status]) : "plan",
        note: map.note>=0 ? String(r[map.note]==null?"":r[map.note]).trim() : ""
      });
      ok++;
      if(!minD || date<minD) minD = date;
      if(!maxD || date>maxD) maxD = date;
    });
    if(ok){
      if(!t.startDate || minD<t.startDate) t.startDate = minD;
      if(!t.endDate || maxD>t.endDate) t.endDate = maxD;
      save("trips");
    }
    save("travelRows");
    if(errors.length){
      document.getElementById("xlMapArea").innerHTML = '<div class="notice">成功导入 '+ok+' 条，'+errors.length+' 行被跳过：</div>'
        +'<div style="font-size:12px;color:var(--red);max-height:180px;overflow-y:auto">'+errors.slice(0,30).join("<br>")+'</div>'
        +'<div class="modal-actions"><button class="btn btn-primary" onclick="closeModal();refreshAll()">完成</button></div>';
    }else{
      closeModal(); refreshAll(); toast("成功导入 "+ok+" 条行程安排");
    }
  };
}
