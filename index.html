const WEEK_CN = ["周一","周二","周三","周四","周五","周六","周日"];
let mealWeekStart = null;

function mealLabel(k){ const f=MEALS.find(m=>m[0]===k); return f?f[1]:"一餐"; }
function weekStartOf(ds){
  const d = new Date(ds+"T00:00:00");
  const wd = (d.getDay()+6)%7;
  d.setDate(d.getDate()-wd);
  return dateStr(d);
}
function curWeekStart(){
  if(!mealWeekStart) mealWeekStart = weekStartOf(todayStr());
  return mealWeekStart;
}
function weekDates(start){ const out=[]; for(let i=0;i<7;i++) out.push(addDays(start,i)); return out; }
function planAt(date, meal){ return state.mealPlans.find(p=>p.date===date && p.meal===meal) || null; }
function planName(p){
  if(!p) return "";
  if(p.recipeId){
    const r = state.recipes.find(x=>x.id===p.recipeId);
    if(r) return r.name;
  }
  return p.text || "未命名";
}

function renderMeals(){
  const el = document.getElementById("view-meals");
  if(!el.dataset.init){
    el.dataset.init = "1";
    el.innerHTML = '<h1 class="page-title">菜单日程</h1><p class="page-sub">按周安排三餐 · 可关联菜谱 · 食材一键进购物清单</p>'
      +'<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">'
      +'<button class="btn btn-ghost btn-sm" id="mlPrev">‹ 上周</button>'
      +'<button class="btn btn-ghost btn-sm" id="mlThis">本周</button>'
      +'<button class="btn btn-ghost btn-sm" id="mlNext">下周 ›</button>'
      +'<span style="flex:1"></span>'
      +'<button class="btn btn-ghost btn-sm" id="mlCopy">复制上周菜单</button>'
      +'<button class="btn btn-primary btn-sm" id="mlShop">'+ICONS.cart+' 生成采购清单</button>'
      +'</div><div id="mlBody"></div>';
    document.getElementById("mlPrev").onclick = ()=>{ mealWeekStart = addDays(curWeekStart(),-7); renderMealsBody(); };
    document.getElementById("mlNext").onclick = ()=>{ mealWeekStart = addDays(curWeekStart(),7); renderMealsBody(); };
    document.getElementById("mlThis").onclick = ()=>{ mealWeekStart = weekStartOf(todayStr()); renderMealsBody(); };
    document.getElementById("mlCopy").onclick = copyLastWeek;
    document.getElementById("mlShop").onclick = openWeekShoppingModal;
  }
  renderMealsBody();
}

function renderMealsBody(){
  const body = document.getElementById("mlBody");
  const start = curWeekStart();
  const dates = weekDates(start);
  const td = todayStr();
  const filled = dates.reduce((s,d)=>s+MEALS.filter(m=>planAt(d,m[0])).length, 0);
  const recipes = state.recipes.length;

  let html = '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--ink-2)">'
    +'<span>'+start+' → '+addDays(start,6)+'</span>'
    +'<span class="chip sage">已排 '+filled+' / 21 餐</span>'
    +(recipes? '<span class="chip mist">菜谱库 '+recipes+' 道</span>'
      : '<span class="chip sand">菜谱库还是空的，先去「菜谱管理」添两道</span>')
    +'</div>';

  html += '<div class="week-grid">';
  dates.forEach((d,i)=>{
    const isToday = d===td;
    html += '<div class="day-col'+(isToday?" today":"")+'">'
      +'<div class="day-title"><b>'+WEEK_CN[i]+'</b><span>'+d.slice(5).replace("-","/")+'</span></div>';
    MEALS.forEach(m=>{
      const p = planAt(d, m[0]);
      html += '<div><div class="meal-label">'+m[1]+'</div>'
        +'<button class="meal-slot'+(p?" filled":"")+'" data-cell="'+d+'|'+m[0]+'">'
        +'<span class="slot-name">'+(p?esc(planName(p)):'<span style="color:var(--ink-3)">+ 安排</span>')+'</span>'
        +(p?'<span class="slot-x" data-clear="'+p.id+'" title="清除">×</span>':'')
        +'</button></div>';
    });
    html += '</div>';
  });
  html += '</div>';
  body.innerHTML = html;

  body.querySelectorAll("[data-cell]").forEach(b=>{
    b.onclick = e=>{
      if(e.target.dataset.clear){ e.stopPropagation(); return; }
      const parts = b.dataset.cell.split("|");
      mealCellModal(parts[0], parts[1]);
    };
  });
  body.querySelectorAll("[data-clear]").forEach(x=>{
    x.onclick = e=>{
      e.stopPropagation();
      const id = x.dataset.clear;
      const p = state.mealPlans.find(y=>y.id===id);
      state.mealPlans = state.mealPlans.filter(y=>y.id!==id);
      save("mealPlans"); refreshAll(); toast("已清除："+planName(p));
    };
  });
}

function mealCellModal(date, meal){
  const p = planAt(date, meal);
  const recipes = state.recipes.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"zh"));
  openModal('<div class="modal-title">'+date+' · '+mealLabel(meal)+'</div>'
    +'<div><label>从菜谱里选</label><select id="mcRecipe"><option value="">（不关联菜谱，手填菜名）</option>'
      +recipes.map(r=>'<option value="'+r.id+'"'+(p&&p.recipeId===r.id?" selected":"")+'>'+esc(r.name)+'</option>').join("")
    +'</select></div>'
    +'<div style="margin-top:12px"><label>或手填菜名 / 安排</label><input id="mcText" value="'+esc(p&&!p.recipeId?(p.text||""):"")+'" placeholder="如：番茄炒蛋 / 外面吃 / 剩菜"></div>'
    +'<div style="margin-top:12px"><label>备注</label><input id="mcNote" value="'+esc(p?(p.note||""):"")+'" placeholder="可选"></div>'
    +'<div class="modal-actions">'+(p?'<button class="btn btn-danger" id="mcDel">删除</button>':"")
    +'<span style="flex:1"></span><button class="btn btn-ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn btn-primary" id="mcSave">保存</button></div>');
  if(p) document.getElementById("mcDel").onclick=()=>{
    state.mealPlans = state.mealPlans.filter(x=>x.id!==p.id);
    save("mealPlans"); closeModal(); refreshAll(); toast("已删除");
  };
  document.getElementById("mcSave").onclick=()=>{
    const rid = document.getElementById("mcRecipe").value;
    const txt = document.getElementById("mcText").value.trim();
    const note = document.getElementById("mcNote").value.trim();
    if(!rid && !txt){ toast("选一道菜谱或填个菜名"); return; }
    const rec = {date:date, meal:meal, recipeId:rid||"", text:rid?"":txt, note:note};
    if(p) Object.assign(p, rec);
    else state.mealPlans.push(Object.assign({id:uid()}, rec));
    save("mealPlans"); closeModal(); refreshAll(); toast("已安排");
  };
}

function copyLastWeek(){
  const start = curWeekStart(), prev = addDays(start,-7);
  let n = 0, skip = 0;
  weekDates(prev).forEach((d,i)=>{
    const target = addDays(start,i);
    MEALS.forEach(m=>{
      const src = planAt(d, m[0]);
      if(!src) return;
      if(planAt(target, m[0])){ skip++; return; }
      state.mealPlans.push({id:uid(), date:target, meal:m[0], recipeId:src.recipeId||"", text:src.text||"", note:src.note||""});
      n++;
    });
  });
  save("mealPlans"); refreshAll();
  toast(n?("已复制 "+n+" 餐"+(skip?("，"+skip+" 餐已有安排未覆盖"):"")):"上周没有可复制的菜单");
}

/* ---------- 本周食材 → 购物清单 ---------- */
function weekRecipes(){
  const ids = new Set();
  weekDates(curWeekStart()).forEach(d=>MEALS.forEach(m=>{
    const p = planAt(d, m[0]);
    if(p && p.recipeId) ids.add(p.recipeId);
  }));
  return state.recipes.filter(r=>ids.has(r.id));
}
function weekIngredients(){
  const map = new Map();
  weekRecipes().forEach(r=>{
    (r.ingredients||[]).forEach(ing=>{
      const key = String(ing.name||"").trim();
      if(!key) return;
      if(!map.has(key)) map.set(key, {name:key, amounts:[], recipes:[]});
      const it = map.get(key);
      if(ing.amount) it.amounts.push(String(ing.amount).trim());
      if(it.recipes.indexOf(r.name)<0) it.recipes.push(r.name);
    });
  });
  return [...map.values()];
}
function openWeekShoppingModal(){
  const items = weekIngredients();
  if(!items.length){
    toast("本周还没有关联菜谱的三餐，先排菜单再生成采购清单");
    return;
  }
  const existing = new Set(state.shopping.filter(s=>!s.purchased).map(s=>String(s.name).trim()));
  let html = '<div class="modal-title">本周采购清单</div>'
    +'<div class="notice mist">来源：本周已排的 '+weekRecipes().length+' 道菜谱。同名食材会自动合并；购物清单里已有的（未购买）默认勾掉，不重复添加。</div>'
    +'<div class="tbl-wrap"><table><thead><tr><th></th><th>食材</th><th>用量</th><th>来自</th></tr></thead><tbody>';
  items.forEach((it,i)=>{
    const dup = existing.has(it.name);
    html += '<tr><td><input type="checkbox" data-ingsel="'+i+'"'+(dup?"":" checked")+'></td>'
      +'<td>'+esc(it.name)+(dup?' <span class="chip">已在清单</span>':"")+'</td>'
      +'<td style="color:var(--ink-2)">'+esc(it.amounts.join(" + ")||"—")+'</td>'
      +'<td style="color:var(--ink-3);font-size:12px">'+esc(it.recipes.join("、"))+'</td></tr>';
  });
  html += '</tbody></table></div>'
    +'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button>'
    +'<button class="btn btn-primary" id="wkShopOk">加入购物清单</button></div>';
  openModal(html, true);
  document.getElementById("wkShopOk").onclick=()=>{
    let n = 0;
    document.querySelectorAll("[data-ingsel]").forEach(cb=>{
      if(!cb.checked) return;
      const it = items[parseInt(cb.dataset.ingsel,10)];
      state.shopping.push({id:uid(), name:it.name, qty:1, budget:"", purchased:false,
        note:(it.amounts.join(" + ")?("用量 "+it.amounts.join(" + ")):"")+"（菜单采购）", source:"菜单"});
      n++;
    });
    save("shopping"); closeModal(); refreshAll();
    toast(n?("已加入 "+n+" 样食材到购物清单"):"没有勾选任何食材");
  };
}

/* ---------- 粘贴文本 → 结构化菜谱（本地规则解析，不上传） ---------- */
function splitIng(ln){
  const line = String(ln||"").trim();
  const byColon = line.match(/^(.{1,18}?)\s*[:：]\s*(.+)$/);
  if(byColon) return {name:byColon[1].trim(), amount:byColon[2].trim()};
  const bySpace = line.match(/^(.{1,18}?)\s+(\S.*)$/);
  if(bySpace && /(?:\d|少许|适量|若干|半|一(?:小)?把|两|三)/.test(bySpace[2]))
    return {name:bySpace[1].trim(), amount:bySpace[2].trim()};
  return {name:line, amount:""};
}
const AMT_RE = /(?:\d+(?:\.\d+)?\s*(?:g|kg|克|千克|ml|毫升|l|升|勺|茶匙|汤匙|个|只|片|瓣|根|把|颗|杯|块|盒|袋|张|条)|少许|适量|若干|半勺|半(?:个|根|颗)|一(?:小)?把)/i;

function parseRecipeText(text){
  const raw = String(text||"");
  const lines = raw.split(/\r?\n/).map(s=>s.replace(/^\s*[·•*\-]+/,"").trim()).filter(Boolean);
  const d = {name:"", ingredients:[], steps:[], servings:"", minutes:"", difficulty:"", tags:[], source:"", note:""};
  if(!lines.length) return d;

  /* 标题：优先取【】内文字，再清掉话题标签与竖线后缀 */
  let first = lines[0];
  const br = first.match(/^[【\[]([^】\]]{1,40})[】\]]/);
  if(br) first = br[1];
  else first = first.replace(/^[#【\[]+/,"");
  first = first.replace(/#[^#\s]{1,12}#/g, "").replace(/\s*[|｜].*$/,"").trim();
  d.name = first.slice(0,40);

  const sm = raw.match(/(\d+)\s*(?:人份|人食|人量)/);
  if(sm) d.servings = sm[1]+" 人份";
  else { const s2 = raw.match(/份量[:：]?\s*([^\n，,。]{1,8})/); if(s2) d.servings = s2[1].trim(); }

  const mm = raw.match(/(\d+)\s*分钟/);
  if(mm) d.minutes = mm[1];
  else { const m2 = raw.match(/(\d+(?:\.\d+)?)\s*(?:小时|h)\b/i); if(m2) d.minutes = String(Math.round(parseFloat(m2[1])*60)); }

  if(/简单|容易|新手|零失败/i.test(raw)) d.difficulty = "简单";
  else if(/困难|有难度|进阶|挑战/.test(raw)) d.difficulty = "困难";
  else if(/中等|一般/.test(raw)) d.difficulty = "中等";

  const tags = new Set();
  for(const m of raw.matchAll(/#([^#\s\n]{1,12})#/g)) tags.add(m[1]);
  const tl = raw.match(/标签[:：]\s*([^\n]+)/);
  if(tl) tl[1].split(/[,\s、，]+/).forEach(t=>{ if(t) tags.add(t); });
  d.tags = [...tags].slice(0,8);

  let mode = "";
  const tips = [];
  /* 把「材料：A 500g，B 2 个」这类单行写法拆成独立行再逐行解析 */
  const norm = [];
  lines.forEach(ln=>{
    const hm = ln.match(/^(食材|用料|材料|配料|主料|辅料|步骤|做法步骤|做法|制作|烹饪)[:：]\s*(.+)$/);
    if(hm){ norm.push(hm[1]); norm.push(hm[2]); }
    else norm.push(ln);
  });
  const splitMultiIng = ln=>{
    const parts = ln.split(/[、,，;；]/).map(s=>s.trim()).filter(Boolean);
    if(parts.length>=2 && parts.filter(p=>AMT_RE.test(p)).length>=2) return parts;
    return [ln];
  };

  norm.forEach((ln,i)=>{
    if(i===0) return;
    if(/^(食材|用料|材料|配料|所需材料|主料|辅料)[:：]?$/.test(ln.trim())){ mode="ing"; return; }
    if(/^(步骤|做法步骤|做法|制作|流程|烹饪)[:：]?$/.test(ln.trim())){ mode="step"; return; }
    if(/^(小贴士|tips|提示|注意|备注|碎碎念)/i.test(ln)){ mode="tip"; return; }
    /* 元信息行：份量/耗时/难度/标签，不当作步骤 */
    if(/人份|人食|耗时[:：]|难度[:：]|份量[:：]|标签[:：]/.test(ln) && ln.length<30) return;

    if(mode==="tip"){ tips.push(ln.replace(/^(小贴士|tips|提示|注意|备注)[:：]?\s*/i,"")); return; }
    if(mode==="ing"){
      if(/^\d+[.、)]/.test(ln)){ mode="step"; const st=ln.replace(/^\d+[.、)]\s*/,"").trim(); if(st) d.steps.push(st); return; }
      splitMultiIng(ln).forEach(seg=>{
        const it = splitIng(seg);
        if(it.name && it.name.length<=18) d.ingredients.push(it);
      });
      return;
    }
    if(!mode){
      const segs = splitMultiIng(ln);
      if(segs.length>1){ segs.forEach(seg=>{ const it=splitIng(seg); if(it.name) d.ingredients.push(it); }); return; }
      if(AMT_RE.test(ln) && ln.length<=24 && !/^\d+[.、)]/.test(ln)){ const it=splitIng(ln); if(it.name) d.ingredients.push(it); return; }
      if(!/^\d+[.、)]/.test(ln) && ln.length<=12){ const it=splitIng(ln); if(it.name) d.ingredients.push(it); return; }
    }
    const step = ln.replace(/^\d+[.、)]\s*/,"").trim();
    if(step && step.length>1) d.steps.push(step);
  });
  if(tips.length) d.note = tips.join(" ");
  d.ingredients = d.ingredients.filter(x=>x.name && !/^(食材|用料|材料)[:：]?$/.test(x.name));
  return d;
}

/* ============================================================
 * 模块 8：身体记录（月历记录体重 / 体脂 / 维度 + 趋势图 + CSV）
 * 数据层：与「运动记录」共用 health（一天一条），但两个模块各自只读写自己的字段，
 *        统一通过 saveHealthRec() 写库，避免互相覆盖。
 * ============================================================ */
let bodyMonth = monthStr(new Date());   // YYYY-MM
let bodyRange = 30;                     // 7 | 30 | 90 | 0(全部)

function bodyDimNames(){
  const s = state.settings||{};
  if(!Array.isArray(s.bodyDims) || !s.bodyDims.length) return ["腰围","胸围","臀围","腿围"];
  return s.bodyDims;
}
function bodyRecMap(){
  const m={};
  (state.health||[]).forEach(r=>{ if(r.date) m[r.date]=r; });
  return m;
}
function bodyExercises(r){ return (r&&Array.isArray(r.exercises))? r.exercises : []; }
function bodyMinutes(r){ return bodyExercises(r).reduce((s,e)=>s+(Number(e.minutes)||0),0); }
function bodyDimCount(r){
  if(!r||!r.dims) return 0;
  return Object.keys(r.dims).filter(k=>r.dims[k]!=="" && r.dims[k]!=null).length;
}
function bodyCutoff(range){ return range? addDays(todayStr(), -(range-1)) : ""; }
function bodyRecsInRange(range){
  const cut = bodyCutoff(range);
  return (state.health||[]).filter(r=>r.date && (!cut || r.date>=cut))
    .slice().sort((a,b)=>a.date.localeCompare(b.date));
}
/* 统一写入口：只覆盖传入字段，其他模块字段原样保留；全空则删掉这天 */
function saveHealthRec(date, patch){
  let rec = (state.health||[]).find(x=>x.date===date);
  if(!rec){
    rec = {id:uid(), date:date, weight:"", bodyFat:"", dims:{}, exercises:[], note:""};
    state.health.push(rec);
  }
  Object.assign(rec, patch);
  const empty = !rec.weight && !rec.bodyFat && !bodyDimCount(rec) && !bodyExercises(rec).length && !rec.note;
  if(empty) state.health = (state.health||[]).filter(x=>x.id!==rec.id);
  save("health");
  return empty? null : rec;
}

/* ---------- 维度项管理 ---------- */

  const dims = bodyDimNames();

/* ---------- 身体 CSV 导出 ---------- */
function bodyCsvRows(){
  const dims = bodyDimNames();
  const head = ["日期","体重","体脂率"].concat(dims).concat(["备注"]);
  const rows = [head];
  (state.health||[])
    .filter(r=>r.date && (Number(r.weight)>0 || r.bodyFat || bodyDimCount(r) || r.note))
    .slice().sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(r=>{
      rows.push([r.date, r.weight||"", r.bodyFat||""]
        .concat(dims.map(d=>(r.dims&&r.dims[d]!=null)?r.dims[d]:""))
        .concat([r.note||""]));
    });
  return rows;
}
function bodyExportCsv(){
  const rows = bodyCsvRows();
  if(rows.length<2){ toast("还没有可导出的身体记录"); return; }
  const csv = "\ufeff" + rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\n");
  downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}), "身体记录_"+todayStr()+".csv");
  toast("已导出 "+rows.length+" 行（含表头）");
}

/* ---------- 身体 CSV 导入（列映射 + 预览 + 错误行） ---------- */
function bodyImportFile(){
  const input = document.getElementById("bdFile");
  const f = input.files && input.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ bodyImportMapping(parseCSV(String(rd.result||""))); };
  rd.readAsText(f, "utf-8");
  input.value = "";
}

function bodyImportMapping(rows){
  if(!rows || rows.length<2){ toast("CSV 内容为空或没有数据行"); return; }
  const header = rows[0].map(h=>String(h==null?"":h).replace(/^\ufeff/,"").trim());
  const guess = (kws)=>{
    for(const k of kws){
      const i = header.findIndex(h=>h.indexOf(k)>=0);
      if(i>=0) return i;
    }
    return "";
  };
  const auto = {
    date: guess(["日期","时间","date"]),
    weight: guess(["体重","weight"]),
    bodyFat: guess(["体脂"]),
    note: guess(["备注","note"])
  };
  const opts = sel => '<option value="">（不导入）</option>' + header.map((h,i)=>'<option value="'+i+'"'+(String(auto[sel])===String(i)?" selected":"")+'>'+esc(h||("第 "+(i+1)+" 列"))+'</option>').join("");
  const field = (label,key)=>'<div><label>'+label+'</label><select id="bm_'+key+'">'+opts(key)+'</select></div>';

  const dims = bodyDimNames();
  const dimFound = dims.filter(d=>header.indexOf(d)>=0);
  const preview = rows.slice(0,5).map(r=>'<tr>'+header.map((h,i)=>'<td>'+esc(String(r[i]==null?"":r[i]).slice(0,20))+'</td>').join("")+'</tr>').join("");

  openModal('<div class="modal-title">导入身体记录（CSV）</div>'
    +'<div class="notice">先确认列对应关系，预览无误再写入。同一天重复出现时以最后一行为准；运动相关的列会被忽略（请到「运动记录」导入）。<br>已识别维度列：'+(dimFound.length?esc(dimFound.join("、")):"未识别（表头需与维度名一致）")+'</div>'
    +'<div class="form-grid" style="gap:12px">'
      +field("日期（必填）","date")+field("体重","weight")+field("体脂率","bodyFat")+field("备注","note")
    +'</div>'
    +'<div style="margin-top:14px"><label>前 5 行预览</label>'
      +'<div class="tbl-wrap" style="max-height:180px;overflow:auto"><table style="min-width:auto"><thead><tr>'+header.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+preview+'</tbody></table></div>'
    +'</div>'
    +'<div id="bmResult" style="margin-top:12px"></div>'
    +'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="bmDo">确认导入</button></div>', true);

  document.getElementById("bmDo").onclick = ()=>{
    const map = {};
    ["date","weight","bodyFat","note"].forEach(k=>{
      const v = document.getElementById("bm_"+k).value;
      map[k] = v===""? "" : Number(v);
    });
    if(map.date===""){ toast("请先选择「日期」对应的列"); return; }
    const res = bodyImportApply(rows, map, header);
    document.getElementById("bmResult").innerHTML = '<div class="notice'+(res.errors.length?"":" mist")+'">写入 '+res.ok+' 行，新建 '+res.added+' 天，更新 '+res.updated+' 天'
      +(res.errors.length?('；'+res.errors.length+' 行被跳过'):'')+'</div>'
      + (res.errors.length? '<div style="font-size:12px;color:var(--red);max-height:150px;overflow:auto">'+res.errors.slice(0,30).map(esc).join("<br>")+'</div>':"");
    document.getElementById("bmDo").disabled = true;
    document.getElementById("bmDo").textContent = "已导入";
    refreshAll();
  };
}

function bodyImportApply(rows, map, header){
  const dims = bodyDimNames();
  const cell = (r,k)=>{
    const i = map[k];
    if(i===""||i==null) return "";
    return String(r[i]==null?"":r[i]).trim();
  };
  const numOf = s => { const n = parseFloat(String(s).replace(/[^\d.\-]/g,"")); return isFinite(n)? n : null; };
  const errors = [];
  let ok=0, added=0, updated=0;
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || !r.some(x=>String(x).trim()!=="")) continue;
    const ds = normalizeDate(cell(r,"date"));
    if(!ds){ errors.push("第 "+(i+1)+" 行：日期「"+(cell(r,"date")||"空")+"」无法识别"); continue; }
    let rec = (state.health||[]).find(x=>x.date===ds);
    const patch = {};
    const w = numOf(cell(r,"weight")); if(w!==null && w>0) patch.weight = w;
    const bf = numOf(cell(r,"bodyFat")); if(bf!==null) patch.bodyFat = bf;
    const dimMap = {};
    dims.forEach(d=>{
      const idx = header.indexOf(d);
      if(idx>=0){ const v = numOf(String(r[idx]==null?"":r[idx]).trim()); if(v!==null) dimMap[d] = v; }
    });
    if(Object.keys(dimMap).length) patch.dims = Object.assign({}, (rec&&rec.dims)||{}, dimMap);
    const nt = cell(r,"note");
    if(nt) patch.note = (rec&&rec.note)? rec.note+"；"+nt : nt;
    if(!Object.keys(patch).length){ errors.push("第 "+(i+1)+" 行：没有可写入的身体数据（体重/体脂/维度均为空）"); continue; }
    if(!rec){ rec = {id:uid(), date:ds, weight:"", bodyFat:"", dims:{}, exercises:[], note:""}; state.health.push(rec); added++; }
    else updated++;
    Object.assign(rec, patch);
    ok++;
  }
  save("health");
  return {ok:ok, added:added, updated:updated, errors:errors};
}

/* ============================================================

function sportMonthRecs(){
  return (state.health||[]).filter(r=>r.date && r.date.startsWith(sportMonth) && bodyExercises(r).length);
}
/* 连续运动天数：今天没练则从昨天往回算 */
function sportStreak(){
  const map = bodyRecMap();
  let i = bodyExercises(map[todayStr()]).length? 0 : 1;
  let n = 0;
  for(; i<3650; i++){
    const d = addDays(todayStr(), -i);
    if(bodyExercises(map[d]).length) n++;
    else break;
  }
  return n;
}

      type: row.querySelector(".ex-type").value.trim(),

      intensity: row.querySelector(".ex-int").value,
      note: ""
    })).filter(e=>e.type||e.minutes);
    const note = document.getElementById("spNote").value.trim();
    if(!exercises.length && !note){ toast("至少填一项运动"); return; }
    saveHealthRec(date, {exercises: exercises, note: note});
    closeModal();
    toast(exercises.length? "已保存 " + date : "已清空 " + date + " 的运动");
    refreshAll();
  };
  const delAll = document.getElementById("spDelAll");
  if(delAll) delAll.onclick = ()=>{
    confirmDanger("清空运动","将删除 "+ds+" 的全部运动记录，体重 / 体脂 / 维度会保留。",()=>{
      saveHealthRec(ds, {exercises: []});
      closeModal(); refreshAll(); toast("已清空这天的运动");
    });
  };
}

/* ---------- 运动 CSV 导出（一天多条运动 → 多行） ---------- */
function sportCsvRows(){

  (state.health||[])
    .filter(r=>r.date && bodyExercises(r).length)
    .slice().sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(r=>{

      exs.forEach((e,i)=>{
        rows.push([r.date, e.type||"", e.minutes||"", e.intensity||"", i===0? (r.note||"") : ""]);

}
function sportExportCsv(){

  const csv = "\ufeff" + rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\n");
  downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}), "运动记录_"+todayStr()+".csv");

/* ---------- 运动 CSV 导入 ---------- */
function sportImportFile(){

  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ sportImportMapping(parseCSV(String(rd.result||""))); };

function sportImportMapping(rows){
  if(!rows || rows.length<2){ toast("CSV 内容为空或没有数据行"); return; }
  const header = rows[0].map(h=>String(h==null?"":h).replace(/^\ufeff/,"").trim());
  const guess = (kws)=>{
    for(const k of kws){
      const i = header.findIndex(h=>h.indexOf(k)>=0);
      if(i>=0) return i;
    }
    return "";
  };
  const auto = {
    date: guess(["日期","时间","date"]),
    exType: guess(["运动类型","项目","运动"]),
    exMin: guess(["时长","分钟","min"]),
    exInt: guess(["强度"]),
    note: guess(["备注","note"])
  };
  const opts = sel => '<option value="">（不导入）</option>' + header.map((h,i)=>'<option value="'+i+'"'+(String(auto[sel])===String(i)?" selected":"")+'>'+esc(h||("第 "+(i+1)+" 列"))+'</option>').join("");
  const field = (label,key)=>'<div><label>'+label+'</label><select id="sm_'+key+'">'+opts(key)+'</select></div>';
  const preview = rows.slice(0,5).map(r=>'<tr>'+header.map((h,i)=>'<td>'+esc(String(r[i]==null?"":r[i]).slice(0,20))+'</td>').join("")+'</tr>').join("");

  openModal('<div class="modal-title">导入运动记录（CSV）</div>'
    +'<div class="notice">先确认列对应关系，预览无误再写入。同一天多行会合并成多段运动；同类型同时长同强度视为重复，不会叠加。</div>'
    +'<div class="form-grid" style="gap:12px">'
      +field("日期（必填）","date")+field("运动类型","exType")+field("时长(分钟)","exMin")+field("强度","exInt")+field("备注","note")
    +'</div>'
    +'<div style="margin-top:14px"><label>前 5 行预览</label>'
      +'<div class="tbl-wrap" style="max-height:180px;overflow:auto"><table style="min-width:auto"><thead><tr>'+header.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+preview+'</tbody></table></div>'
    +'</div>'
    +'<div id="smResult" style="margin-top:12px"></div>'
    +'<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" id="smDo">确认导入</button></div>', true);

  document.getElementById("smDo").onclick = ()=>{
    const map = {};
    ["date","exType","exMin","exInt","note"].forEach(k=>{
      const v = document.getElementById("sm_"+k).value;
      map[k] = v===""? "" : Number(v);
    });
    if(map.date===""){ toast("请先选择「日期」对应的列"); return; }
    if(map.exType===""){ toast("请先选择「运动类型」对应的列"); return; }
    const res = sportImportApply(rows, map);
    document.getElementById("smResult").innerHTML = '<div class="notice'+(res.errors.length?"":" mist")+'">写入 '+res.ok+' 行，新建 '+res.added+' 天，追加运动 '+res.exN+' 项'
      +(res.errors.length?('；'+res.errors.length+' 行被跳过'):'')+'</div>'
      + (res.errors.length? '<div style="font-size:12px;color:var(--red);max-height:150px;overflow:auto">'+res.errors.slice(0,30).map(esc).join("<br>")+'</div>':"");
    document.getElementById("smDo").disabled = true;
    document.getElementById("smDo").textContent = "已导入";
    refreshAll();
  };
}

function sportImportApply(rows, map){
  const cell = (r,k)=>{
    const i = map[k];
    if(i===""||i==null) return "";
    return String(r[i]==null?"":r[i]).trim();
  };
  const numOf = s => { const n = parseFloat(String(s).replace(/[^\d.\-]/g,"")); return isFinite(n)? n : null; };
  const errors = [];
  let ok=0, added=0, exN=0;
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || !r.some(x=>String(x).trim()!=="")) continue;
    const ds = normalizeDate(cell(r,"date"));
    if(!ds){ errors.push("第 "+(i+1)+" 行：日期「"+(cell(r,"date")||"空")+"」无法识别"); continue; }
    const et = cell(r,"exType");
    const mins = numOf(cell(r,"exMin"))||0;
    if(!et && !mins){ errors.push("第 "+(i+1)+" 行：运动类型与时长都为空"); continue; }
    let rec = (state.health||[]).find(x=>x.date===ds);
    if(!rec){ rec = {id:uid(), date:ds, weight:"", bodyFat:"", dims:{}, exercises:[], note:""}; state.health.push(rec); added++; }
    const inten = cell(r,"exInt")||"";
    const dup = bodyExercises(rec).some(e=>e.type===et && Number(e.minutes)===Number(mins) && (e.intensity||"")===inten);
    if(!dup && (et||mins)){
      rec.exercises.push({type:et||"运动", minutes:mins, intensity:inten, note:""});
      exN++;
    }
    const nt = cell(r,"note");
    if(nt && !(rec.note||"").includes(nt)) rec.note = rec.note? rec.note+"；"+nt : nt;
    ok++;
  }
  save("health");
  return {ok:ok, added:added, exN:exN, errors:errors};
}

/* ---------- 类型分布（内联 SVG 横条） ---------- */
function sportTypeBars(el, recs){
  if(!el) return;
  const agg = {};
  recs.forEach(r=>bodyExercises(r).forEach(e=>{
    const k = String(e.type||"未分类").trim() || "未分类";
    agg[k] = (agg[k]||0) + (Number(e.minutes)||0);
  }));
  const list = Object.keys(agg).map(k=>({k:k, v:agg[k]})).sort((a,b)=>b.v-a.v).slice(0,8);
  if(!list.length){
    el.innerHTML = '<div class="empty" style="padding:24px"><p>该区间还没有运动记录</p></div>';
    return;
  }
  const max = Math.max(...list.map(x=>x.v)) || 1;
  const W=520, rowH=27, H=list.length*rowH+4, labelW=92, barMax=W-labelW-56;
  let rows="";
  list.forEach((x,i)=>{
    const y = i*rowH+6;
    const w = Math.max(2, x.v/max*barMax);
    rows += '<text x="0" y="'+(y+12)+'" font-size="12" fill="#2E2E2A">'+esc(x.k)+'</text>'
      +'<rect x="'+labelW+'" y="'+y+'" width="'+barMax+'" height="15" rx="4" fill="#F1F1EA"/>'
      +'<rect x="'+labelW+'" y="'+y+'" width="'+w.toFixed(1)+'" height="15" rx="4" fill="#7C9070"><title>'+esc(x.k)+' '+x.v+' 分钟</title></rect>'
      +'<text x="'+(labelW+barMax+8)+'" y="'+(y+11.5)+'" font-size="11" fill="#9B9B93">'+x.v+'′</text>';
  });
  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+rows+'</svg>';
}

/* 折线图（多序列，内联 SVG） */
function bodyChart(el, series, cfg){
  cfg = cfg||{};
  if(!el) return;
  const all = series.flatMap(s=>s.points);
  if(!all.length){
    el.innerHTML = '<div class="empty" style="padding:28px"><p>'+esc(cfg.empty||"该区间还没有数据")+'</p></div>';
    return;
  }
  const W=560,H=200,pl=42,pr=14,pt=14,pb=26;
  const dates = [...new Set(all.map(p=>p.date))].sort();
  let vmin=Math.min(...all.map(p=>p.value)), vmax=Math.max(...all.map(p=>p.value));
  if(vmin===vmax){ vmin-=1; vmax+=1; }
  const pad=(vmax-vmin)*0.15; vmin-=pad; vmax+=pad;
  const xOf = d => dates.length===1 ? pl+(W-pl-pr)/2 : pl+(dates.indexOf(d)/(dates.length-1))*(W-pl-pr);
  const yOf = v => pt+(1-(v-vmin)/(vmax-vmin))*(H-pt-pb);
  const dec = cfg.dec||0;
  let grid="";
  for(let i=0;i<=3;i++){
    const v=vmin+(vmax-vmin)*i/3, yy=yOf(v);
    grid += '<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="#EFEFE9"/>'
      +'<text x="'+(pl-6)+'" y="'+(yy+3.5)+'" font-size="10" fill="#9B9B93" text-anchor="end">'+v.toFixed(dec)+'</text>';
  }
  let paths="";
  series.forEach(s=>{
    if(!s.points.length) return;
    const d = s.points.map((p,i)=>(i?"L":"M")+xOf(p.date).toFixed(1)+" "+yOf(p.value).toFixed(1)).join(" ");
    paths += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    paths += s.points.map(p=>'<circle cx="'+xOf(p.date).toFixed(1)+'" cy="'+yOf(p.value).toFixed(1)+'" r="3" fill="#fff" stroke="'+s.color+'" stroke-width="1.8"><title>'+esc(p.date)+' '+esc(s.name)+' '+p.value+'</title></circle>').join("");
  });
  const xl = [0, Math.floor((dates.length-1)/2), dates.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  const labels = xl.map(i=>'<text x="'+xOf(dates[i]).toFixed(1)+'" y="'+(H-8)+'" font-size="10" fill="#9B9B93" text-anchor="middle">'+esc(dates[i].slice(5))+'</text>').join("");
  const legend = '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:6px">'
    + series.filter(s=>s.points.length).map(s=>'<span><i style="display:inline-block;width:10px;height:3px;border-radius:2px;background:'+s.color+';margin-right:5px;vertical-align:3px"></i>'+esc(s.name)+'</span>').join("")
    + '</div>';
  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+paths+labels+'</svg>'+legend;
}

/* 柱状图（当日分钟数） */
function bodyBarChart(el, data){
  if(!el) return;
  const total = data.reduce((s,d)=>s+d.value,0);
  if(!total){
    el.innerHTML = '<div class="empty" style="padding:28px"><p>近 '+data.length+' 天还没有运动记录</p></div>';
    return;
  }
  const max = Math.max(1, ...data.map(d=>d.value));
  const W=560,H=170,pl=34,pr=10,pt=12,pb=22;
  const bw=(W-pl-pr)/Math.max(1,data.length);
  let bars="";
  data.forEach((d,i)=>{
    const h = d.value? Math.max(3,(d.value/max)*(H-pt-pb)) : 0;
    const x = pl+i*bw+bw*0.18, w = Math.max(1.5, bw*0.64);
    if(h) bars += '<rect x="'+x.toFixed(1)+'" y="'+(H-pb-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="1.5" fill="#8FA3B8"><title>'+esc(d.date)+'  '+d.value+' 分钟</title></rect>';
  });
  const active = data.filter(d=>d.value>0).length;
  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'
    +'<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+(W-pr)+'" y2="'+(H-pb)+'" stroke="#E6E6DF"/>'
    +'<text x="'+(pl-6)+'" y="'+(pt+8)+'" font-size="10" fill="#9B9B93" text-anchor="end">'+Math.round(max)+'′</text>'
    +bars+'</svg>'
    +'<div style="font-size:12px;color:var(--ink-3);margin-top:6px">近 '+data.length+' 天：运动 '+active+' 天，合计 '+total+' 分钟</div>';
}
/* ============================================================
 * 模块 9：愿望清单 / 旅游清单

let wishKind = "wish";          // wish | travel
let wishFilter = {q:"", type:"all", status:"all", sort:"priority"};

const WISH_TYPES = ["旅行","物品","体验","学习","其他"];
const WISH_STATUS = ["idea","doing","done","drop"];
const WISH_STATUS_CN = {idea:"想做", doing:"进行中", done:"已实现", drop:"已放弃"};
const WISH_STATUS_CLS = {idea:"", doing:"mist", done:"sage", drop:""};
const PRIO_CN = {high:"高", mid:"中", low:"低"};

function renderWishes(){
  const el = document.getElementById("view-wishes");
  if(!el.dataset.init){
    el.dataset.init = "1";
    el.innerHTML = '<h1 class="page-title">愿望清单</h1><p class="page-sub">想做的事、想买的东西、想去的地方 · 分类筛选与状态流转</p>'

      +'<button class="btn btn-sm '+(wishKind==="travel"?"btn-primary":"btn-ghost")+'" data-wk="travel">旅游清单</button>'
      +'<span style="flex:1"></span>'
      +'<button class="btn btn-primary btn-sm" id="wishNew">'+ICONS.plus+' 新建</button>'

  }

function wishList(kind){
  return (state.wishes||[]).filter(w=>(w.kind||"wish")===kind);
}
function renderWishesBody(){
  const box = document.getElementById("wishBody");
  if(!box) return;
  const kind = wishKind;
  const all = wishList(kind);
  const types = kind==="wish" ? WISH_TYPES : ["旅行"];

  let list = all.slice();
  if(wishFilter.q){
    const q = wishFilter.q;
    list = list.filter(w=>String(w.title||"").includes(q) || String(w.note||"").includes(q) || String(w.bestTime||"").includes(q));
  }
  if(wishFilter.type!=="all") list = list.filter(w=>(w.type||"其他")===wishFilter.type);
  if(wishFilter.status!=="all") list = list.filter(w=>(w.status||"idea")===wishFilter.status);
  const prioRank = {high:0, mid:1, low:2};
  list.sort((a,b)=>{
    if(wishFilter.sort==="priority"){
      const d = (prioRank[a.priority]===undefined?1:prioRank[a.priority]) - (prioRank[b.priority]===undefined?1:prioRank[b.priority]);
      if(d) return d;
      return String(a.targetDate||"9999").localeCompare(String(b.targetDate||"9999"));
    }
    if(wishFilter.sort==="date") return String(a.targetDate||"9999").localeCompare(String(b.targetDate||"9999"));
    if(wishFilter.sort==="budget") return (Number(b.budget)||0)-(Number(a.budget)||0);
    return String(b.createdAt||"").localeCompare(String(a.createdAt||""));
  });

  const totalBudget = all.reduce((s,w)=>s+(Number(w.budget)||0),0);
  const doneN = all.filter(w=>(w.status||"idea")==="done").length;
  const doingN = all.filter(w=>w.status==="doing").length;

  let html = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'
    +'<input id="wishQ" placeholder="搜索标题/备注" value="'+esc(wishFilter.q)+'" style="max-width:200px">'
    +(kind==="wish"?'<select id="wishType" style="max-width:130px"><option value="all">全部类型</option>'+types.map(t=>'<option value="'+t+'"'+(wishFilter.type===t?" selected":"")+'>'+t+'</option>').join("")+'</select>':"")
    +'<select id="wishStatus" style="max-width:130px"><option value="all">全部状态</option>'+WISH_STATUS.map(s=>'<option value="'+s+'"'+(wishFilter.status===s?" selected":"")+'>'+WISH_STATUS_CN[s]+'</option>').join("")+'</select>'
    +'<select id="wishSort" style="max-width:140px">'
      +[["priority","按优先级"],["date","按目标日期"],["budget","按预算"],["new","按新增"]].map(x=>'<option value="'+x[0]+'"'+(wishFilter.sort===x[0]?" selected":"")+'>'+x[1]+'</option>').join("")
    +'</select>'
    +'</div>'
    +'<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:14px">'
      +'<span>共 <b style="color:var(--ink);font-size:13px">'+all.length+'</b> 条</span>'
      +'<span>进行中 <b style="color:var(--mist);font-size:13px">'+doingN+'</b></span>'
      +'<span>已实现 <b style="color:var(--sage);font-size:13px">'+doneN+'</b></span>'
      +'<span>预算合计 <b style="color:var(--ink);font-size:13px">'+fmtMoney(totalBudget)+'</b></span>'
    +'</div>';

  if(!all.length){
    html += '<div class="card"><div class="empty">'+ICONS.star
      +'<p>'+(kind==="wish"?"还没有愿望。写下第一个想做的事吧":"旅游清单还是空的。收藏一个想去的地方，之后可以一键生成行程")+'</p>'
      +'<div style="margin-top:16px"><button class="btn btn-primary btn-sm" id="wishEmptyNew">+ 新建</button></div></div></div>';
  }else if(!list.length){
    html += '<div class="card"><div class="empty"><p>没有符合条件的条目，换个筛选试试</p></div></div>';
  }else{
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--sp-3)">';
    list.forEach(w=>{
      const st = w.status||"idea";
      const prio = w.priority||"mid";
      html += '<div class="wish-card">'
        +'<div class="wish-title"><span class="'+(st==="done"?"done":"")+'">'+esc(w.title||"未命名")+'</span></div>'
        +'<div class="wish-meta">'
          +'<span class="chip '+(prio==="high"?"red":prio==="low"?"": "sand")+'">'+PRIO_CN[prio]+'优先级</span>'
          +(kind==="wish"?'<span class="chip">'+esc(w.type||"其他")+'</span>':(w.bestTime?'<span class="chip">最佳：'+esc(w.bestTime)+'</span>':""))
          +(w.budget?'<span>预算 '+fmtMoney(w.budget)+'</span>':"")
          +(w.targetDate?'<span>目标 '+esc(w.targetDate)+'</span>':"")
          +(kind==="travel"&&w.tripId?'<span class="chip sage">已建行程</span>':"")
        +'</div>'
        +(w.note?'<div style="font-size:12px;color:var(--ink-2);line-height:1.6;max-height:38px;overflow:hidden">'+esc(w.note)+'</div>':"")
        +(w.link?'<a href="'+esc(w.link)+'" target="_blank" rel="noopener" style="font-size:12px;color:var(--mist);word-break:break-all">'+esc(w.link.slice(0,40))+'</a>':"")
        +'<div style="display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap">'
          +'<button class="btn btn-sm btn-ghost" data-wst="'+w.id+'" title="点击切换状态"><span class="chip '+WISH_STATUS_CLS[st]+'">'+WISH_STATUS_CN[st]+'</span></button>'
          +(kind==="travel" && !w.tripId ? '<button class="btn btn-sm btn-ghost" data-wtrip="'+w.id+'">建行程</button>' : "")
          +'<span style="flex:1"></span>'
          +'<button class="btn btn-sm btn-ghost btn-icon" data-wedit="'+w.id+'" title="编辑">'+ICONS.edit+'</button>'
          +'<button class="btn btn-sm btn-ghost btn-icon" data-wdel="'+w.id+'" title="删除">'+ICONS.trash+'</button>'
        +'</div></div>';
    });
    html += '</div>';
  }
  box.innerHTML = html;

  const q = document.getElementById("wishQ");
  q.oninput = ()=>{ wishFilter.q = q.value.trim(); renderWishesBody(); };
  const selT = document.getElementById("wishType"); if(selT) selT.onchange = ()=>{ wishFilter.type=selT.value; renderWishesBody(); };

let memoFilter = {q:"", tag:"all", show:"active"}; // active | done | all

function memoNextFire(m){
  /* 计算下一次触发日期（含重复规则） */
  if(!m.remindAt) return null;
  const base=m.remindAt.slice(0,10), time=m.remindAt.slice(11)||"09:00";
  let d=base; const td=todayStr();
  if(m.repeat==="none") return m.remindAt;
  let guard=0;
  while(d<td && guard++<400){
    if(m.repeat==="daily") d=addDays(d,1);
    else if(m.repeat==="weekly") d=addDays(d,7);
    else if(m.repeat==="monthly"){ const t=new Date(d+"T00:00:00"); t.setMonth(t.getMonth()+1); d=dateStr(t); }
  }
  return d+" "+time;
}
function memoStatus(m){
  if(m.done) return {label:"已完成", cls:"sage"};
  const nf=memoNextFire(m);
  if(!nf) return {label:"无提醒", cls:""};
  if(nf.slice(0,10)<todayStr()) return {label:"已逾期", cls:"red"};
  if(nf.slice(0,10)===todayStr()) return {label:"今日到期", cls:"sand"};
  return {label:nf.slice(0,10)+" 提醒", cls:"mist"};
}

/* ---------- 添加到苹果提醒事项：方案 A（.ics 下载）+ 方案 C（复制内容） ----------
 * 说明：网页无法直接写入 iOS 提醒事项（系统权限限制），最稳妥做法是
 * 生成标准 .ics 日历事件文件（iOS 打开即导入），并提供一键复制内容。 */
function exportMemoICS(id){
  const m=state.memos.find(x=>x.id===id); if(!m) return;
  const dstr=(m.remindAt||todayStr()+" 09:00").replace(/[-:]/g,"").replace(" ","T")+"00";
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//wb-life-workspace//CN","BEGIN:VEVENT",
    "UID:"+m.id+"@wb-life","DTSTART:"+dstr,"SUMMARY:"+icsEsc(m.title),
    m.content?("DESCRIPTION:"+icsEsc(m.content)):"",
    "BEGIN:VALARM","TRIGGER:-PT0M","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(m.title),"END:VALARM",
    "END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  const text=m.title+(m.content?("\n"+m.content):"")+"\n提醒时间："+m.remindAt;
  openModal('<div class="modal-title">添加到苹果提醒事项</div>'
    +'<div class="notice">网页受 iOS 权限限制无法直接写入「提醒事项」。推荐两种方式：<br>① 下载 .ics 文件 → 用 iPhone/iPad 打开 → 自动导入日历并带提醒；<br>② 复制内容 → 打开提醒事项 App 手动粘贴。</div>'
    +'<div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap">'
    +'<button class="btn btn-primary" id="icsDownload">下载 .ics 提醒文件</button>'
    +'<button class="btn btn-ghost" id="icsCopy">复制提醒内容</button>'
    +'<button class="btn btn-ghost" onclick="closeModal()">关闭</button></div>');
  document.getElementById("icsDownload").onclick=()=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
    a.download="提醒_"+m.title.slice(0,20)+".ics"; a.click(); URL.revokeObjectURL(a.href);
    toast("已下载，用 iPhone 打开即可导入");
  };
  document.getElementById("icsCopy").onclick=()=>{
    (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast("已复制，去提醒事项粘贴吧")).catch(()=>toast("复制失败，请手动长按选择"));
  };
}
function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }

function boot(){
  loadState();
  /* 云同步：先拉取云端，再决定是否播种示例数据，避免示例覆盖真实数据 */
  const cloudReady = (window.__cloud && window.__cloud.init)
    ? window.__cloud.init()
    : Promise.resolve({cloudHasData:false, mode:"local"});
  cloudReady.then(r=>{
    /* 只有「本地模式」或「云端已成功拉取且为空」时才播种，避免示例数据覆盖云端真实数据 */
    const canSeed = !(r && r.cloudHasData) && (!r || r.mode !== "cloud" || r.pulled);
    if(canSeed){
      seedData(); seedCollections(); seedItems(); seedPacking();
      seedTravel(); seedMeals(); seedBodyWishes();
    }
    loadState();
    afterBoot(r);
  }).catch(()=>{ loadState(); afterBoot({mode:"local"}); });
}

function afterBoot(cloudResult){
  /* 首次访问：窄屏默认收起，宽屏默认展开 */
  if(state.settings.navCollapsed===undefined){
    state.settings.navCollapsed = window.innerWidth<=860;
    save("settings");
  }
  document.body.classList.toggle("nav-collapsed", !!state.settings.navCollapsed);
  document.getElementById("navToggle").addEventListener("click", ()=>setNavCollapsed(!document.body.classList.contains("nav-collapsed")));
  document.getElementById("navBackdrop").addEventListener("click", ()=>setNavCollapsed(true,true));
  window.addEventListener("resize", updateNavBackdrop);
  /* 独立托管（无平台数据 SDK）时不显示同步胶囊，避免顶栏留一个无意义的灰点 */
  if(!(window.__SMART_PAGE__ && window.__SMART_PAGE__.database)){
    var pl=document.getElementById("cloudPill");
    if(pl) pl.style.display="none";
  }
  switchView("dashboard");
  /* 云端原本为空：把本地（含示例或已有）数据整体上传 */
  if(cloudResult && cloudResult.mode==="cloud" && !cloudResult.cloudHasData && window.__cloud && window.__cloud.pushAll){
    window.__cloud.pushAll();
  }
}
document.addEventListener("DOMContentLoaded",boot);

function pullAll(){
  var db = getDb(); var out = {};
  function page(cursor){
    return db.query(cursor
      ? { databaseId: DATABASE_ID, pageSize: 50, startCursor: cursor }
      : { databaseId: DATABASE_ID, pageSize: 50 }
    ).then(function(r){
      ((r && r.results) || []).forEach(function(row){ var k = row && row["键"]; if(k) out[k] = row; });
      if(r && r.hasMore && r.nextCursor) return page(r.nextCursor);
      return out;
    });
  }
  return page(null);
}

function applyRow(row){
  var key = row["键"], ver = Number(row["版本"])||0, content = row["内容"];
  if(!key || typeof content !== "string") return false;
  var val; try{ val = JSON.parse(content); }catch(e){ return false; }
  if(key === "collections") val = restoreImages(val, getLocal("collections"));
  if(!setLocal(key, val)) return false;
  C.rev[key] = ver;
  if(row._id) C.rowId[key] = row._id;
  return true;
}

function mergeRows(rows){
  var hasData = false, applied = 0;
  Object.keys(rows).forEach(function(k){
    var row = rows[k];
    var content = typeof row["内容"] === "string" ? row["内容"] : "";
    if(content && content !== "[]" && content !== "{}" && content !== "null") hasData = true;
    var ver = Number(row["版本"])||0;
    var localRev = C.rev[k]||0;
    if(C.dirty[k]){
      if(ver > localRev) C.rev[k] = ver;
      return;
    }
    if(ver > localRev && applyRow(row)) applied++;
  });
  writeMeta();
  return { hasData: hasData, applied: applied };
}

/* ---------- 推 ---------- */
function syncRowIds(){
  var db = getDb(); if(!db) return Promise.resolve();
  return db.query({ databaseId: DATABASE_ID, pageSize: 50 }).then(function(r){
    ((r && r.results) || []).forEach(function(row){
      if(row && row["键"] && row._id) C.rowId[row["键"]] = row._id;
    });
    writeMeta();
  }).catch(function(){});
}

C.push = function(keys){
  if(C.mode !== "cloud") return Promise.resolve(false);
  var db = getDb(); if(!db) return Promise.resolve(false);
  keys = keys || Object.keys(C.dirty);
  if(!keys.length) return Promise.resolve(true);
  if(C.busy) return Promise.resolve(false);
  C.busy = true; setStatus("syncing");
  var missingId = false;
  var jobs = keys.map(function(key){
    var val = getLocal(key);
    if(val === null){ delete C.dirty[key]; return Promise.resolve(); }
    var content = slim(JSON.stringify(val));
    if(content.length > MAX_CHARS){ C.msg = key + " 体积超限"; delete C.dirty[key]; return Promise.resolve(); }
    var stamp = Date.now();
    var props = {
      "键":{ text:key },
      "内容":{ text:content },
      "版本":{ number:stamp },
      "更新于":{ date:new Date(stamp).toISOString() }
    };
    var rid = C.rowId[key];
    var op;
    if(rid){
      op = db.updateRecord({ databaseId: DATABASE_ID, recordId: rid, properties: props });
    }else{
      missingId = true;
      op = db.addRecord({ databaseId: DATABASE_ID, properties: props }).then(function(res){
        var id = res && (res.id || res._id || (res.result && res.result._id));
        if(id) C.rowId[key] = id;
      });
    }
    return op.then(function(){ C.rev[key] = stamp; delete C.dirty[key]; writeMeta(); });
  });
  return Promise.all(jobs).then(function(){
    C.busy = false; C.lastSync = Date.now(); writeMeta();
    var tail = missingId ? syncRowIds() : Promise.resolve();
    return tail.then(function(){ setStatus("ok"); return true; });
  }).catch(function(e){
    C.busy = false; setStatus("error", String(e && e.message || e));
    return false;
  });
};

C.pushAll = function(force){
  if(C.mode !== "cloud") return Promise.resolve(false);
  if(force) C.rev = {};
  KEYS.forEach(function(k){ C.dirty[k] = true; });
  return C.push(KEYS.slice());
};

C.pullOverride = function(){
  var db = getDb(); if(!db) return Promise.resolve(false);
  setStatus("syncing");
  return pullAll().then(function(rows){
    Object.keys(rows).forEach(function(k){ applyRow(rows[k]); });
    C.dirty = {}; C.lastSync = Date.now(); writeMeta(); setStatus("ok");
    return true;
  }).catch(function(){ setStatus("error"); return false; });
};

C.sync = function(){
  if(C.mode !== "cloud") return Promise.resolve(false);
  var db = getDb(); if(!db) return Promise.resolve(false);
  if(C.busy) return Promise.resolve(false);
  setStatus("syncing");
  return pullAll().then(function(rows){
    mergeRows(rows);
    return C.push();
  }).catch(function(e){ setStatus("error", String(e && e.message || e)); return false; });
};

/* ---------- 启动 ---------- */
C.init = function(){
  readMeta(); paint();
  if(!configured()){ C.mode = "local"; setStatus("local"); return Promise.resolve({ cloudHasData:false, mode:"local", pulled:false }); }
  var db = getDb();
  if(!db){ C.mode = "local"; setStatus("local"); return Promise.resolve({ cloudHasData:false, mode:"local", pulled:false }); }

  C.mode = "cloud"; setStatus("syncing");
  return new Promise(function(resolve){
    var done = false;
    var timer = setTimeout(function(){
      if(done) return; done = true;
      C.mode = "local"; setStatus("error", "连接超时");
      resolve({ cloudHasData:false, mode:"local", pulled:false });
    }, TIMEOUT);

    pullAll().then(function(rows){
      if(done) return;
      var r = mergeRows(rows);
      C.lastSync = Date.now(); writeMeta(); setStatus("ok");
      done = true; clearTimeout(timer);
      resolve({ cloudHasData: r.hasData || Object.keys(rows).length > 0, mode:"cloud", pulled:true });
    }).catch(function(e){
      if(done) return;
      C.mode = "local"; setStatus("error", String(e && e.message || e));
      done = true; clearTimeout(timer);
      resolve({ cloudHasData:false, mode:"local", pulled:false });
    });
  });
};

C.markDirty = function(key){
  if(C.mode !== "cloud") return;
  C.dirty[key] = true;
  if(C.timer) clearTimeout(C.timer);
  C.timer = setTimeout(function(){ C.timer = null; C.push(); }, 1200);
};
C.markDirtyAll = function(){
  if(C.mode !== "cloud") return;
  KEYS.forEach(function(k){ C.dirty[k] = true; });
  if(C.timer) clearTimeout(C.timer);
  C.timer = setTimeout(function(){ C.timer = null; C.push(); }, 1200);
};

/* ---------- 交互 ---------- */
var pill = document.getElementById("cloudPill");
if(pill) pill.addEventListener("click", function(){
  if(C.mode !== "cloud"){ toast("数据已保存在本机，无需同步"); switchView("settings"); return; }
  toast("正在同步…");
  C.sync().then(function(ok){
    if(C.status === "ok"){ loadState(); refreshAll(); toast("已同步"); }
    else toast("同步失败，请检查网络后重试");
  });
});

/* 回到前台且距上次同步超过 1 分钟：自动拉一次 */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState !== "visible") return;
  if(C.mode !== "cloud") return;
  if(Date.now() - (C.lastSync||0) < 60000) return;
  if(C.busy) return;
  C.sync().then(function(ok){
    if(ok && C.status === "ok"){ loadState(); refreshAll(); }
  });
});

paint();
})();
</script>
